// Validate an imported custom-session JSON object. Returns [normalizedSession, null]
// on success, or [null, errorMessage] on failure.
function validateCustomSession(obj, existingIds) {
  if (!obj || typeof obj !== "object") return [null, "Not a valid JSON object."];
  if (obj.schemaVersion !== 1) return [null, "Unsupported schemaVersion (expected 1)."];
  if (!obj.id || typeof obj.id !== "string") return [null, "Missing or invalid `id`."];
  if (!obj.name || typeof obj.name !== "string") return [null, "Missing or invalid `name`."];
  if (!["power","hypertrophy","custom"].includes(obj.type)) return [null, '`type` must be "power", "hypertrophy", or "custom".'];
  if (!Array.isArray(obj.exercises) || obj.exercises.length === 0) return [null, "`exercises` must be a non-empty array."];
  if (existingIds && existingIds.includes(obj.id)) return [null, `A session with id "${obj.id}" already exists. Change the id or delete the old one first.`];

  const normalized = {
    schemaVersion: 1,
    id: obj.id,
    name: obj.name,
    description: obj.description || "",
    type: obj.type,
    icon: obj.icon || (obj.type === "power" ? "⚡" : obj.type === "hypertrophy" ? "◆" : "●"),
    createdAt: obj.createdAt || Date.now(),
    exercises: [],
  };

  for (let i = 0; i < obj.exercises.length; i++) {
    const ex = obj.exercises[i];
    if (!ex.name || typeof ex.name !== "string") return [null, `Exercise #${i+1}: missing name.`];
    if (!Number.isInteger(ex.tier) || ex.tier < 1 || ex.tier > 3) return [null, `"${ex.name}": tier must be 1, 2, or 3.`];
    if (!Number.isInteger(ex.sets) || ex.sets < 1) return [null, `"${ex.name}": sets must be a positive integer.`];
    if (typeof ex.repRange !== "string" || !/^\d+-\d+$/.test(ex.repRange)) return [null, `"${ex.name}": repRange must be a string like "8-12".`];
    if (typeof ex.startWeight !== "number" || ex.startWeight < 0) return [null, `"${ex.name}": startWeight must be a non-negative number.`];

    const norm = {
      name: ex.name,
      day: obj.id, // normalize: each exercise references the custom session's id
      tier: ex.tier,
      sets: ex.sets,
      repRange: ex.repRange,
      startWeight: ex.startWeight,
      note: ex.note || "",
    };
    if (ex.barbell === true) {
      norm.barbell = true;
      if (typeof ex.barWeight !== "number" || ex.barWeight <= 0) return [null, `"${ex.name}": barWeight is required when barbell is true.`];
      norm.barWeight = ex.barWeight;
    }
    if (typeof ex.supersetWith === "string") norm.supersetWith = ex.supersetWith;
    // Optional finishers — never gate finishing, never counted as abandoned.
    if (ex.optional === true) norm.optional = true;
    // Carry load across from prior history instead of using startWeight cold.
    if (Array.isArray(ex.seedFrom)) {
      const seeds = ex.seedFrom.filter(n => typeof n === "string" && n.trim());
      if (seeds.length) norm.seedFrom = seeds;
    }
    if (ex.rest && typeof ex.rest === "object") {
      const rest = {};
      if (typeof ex.rest.set === "number" && ex.rest.set >= 0) rest.set = ex.rest.set;
      if (typeof ex.rest.betweenEx === "number" && ex.rest.betweenEx >= 0) rest.betweenEx = ex.rest.betweenEx;
      if (Object.keys(rest).length) norm.rest = rest;
    }
    normalized.exercises.push(norm);
  }
  return [normalized, null];
}

function WorkoutTab({ workoutLogs, setWorkoutLogs, setActiveSession, startSession, draftSession, customSessions, setCustomSessions, program, programId, setProgramId }) {
  const [view, setView] = useState("plan");
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmDelCustom, setConfirmDelCustom] = useState(null);
  const [importOpen, setImportOpen] = useState(false);
  const [importText, setImportText] = useState("");
  const [importError, setImportError] = useState("");
  const [importSaved, setImportSaved] = useState(false);
  const history = Object.entries(workoutLogs).sort((a,b) => b[1].ts-a[1].ts);

  const deleteSession = (key) => {
    setWorkoutLogs(prev => { const n = {...prev}; delete n[key]; return n; });
    setConfirmDelete(null);
  };
  const deleteCustomSession = (id) => {
    setCustomSessions(prev => prev.filter(s => s.id !== id));
    setConfirmDelCustom(null);
  };
  const handleImport = () => {
    setImportError("");
    let parsed;
    try { parsed = JSON.parse(importText); }
    catch (e) { setImportError("Invalid JSON — check for syntax errors."); return; }
    const existingIds = customSessions.map(s => s.id);
    const [norm, err] = validateCustomSession(parsed, existingIds);
    if (err) { setImportError(err); return; }
    setCustomSessions(prev => [...prev, norm]);
    setImportText("");
    setImportSaved(true);
    setTimeout(() => { setImportOpen(false); setImportSaved(false); }, 900);
  };

  return (
    <>
      {draftSession?.dayName && (
        <div className="draft-banner">
          <div>
            <div className="dk">Unfinished session</div>
            <div className="dv">{draftSession.dayName}</div>
          </div>
          <button onClick={() => setActiveSession(draftSession.dayName)}>Resume →</button>
        </div>
      )}

      <div className="view-switch">
        {["plan","history"].map(v => (
          <button key={v} className={view===v?"on":""} onClick={() => setView(v)}>{v}</button>
        ))}
      </div>

      {view==="plan" && (
        <>
          {/* Program switcher — PHUL stays available; switching doesn't touch any
              history, because logs resolve their day through lookupDay() across
              every program rather than through whichever one is active. */}
          <div className="prog-switch">
            {Object.values(PROGRAMS).map(pg => (
              <button key={pg.id} className={programId===pg.id?"on":""} onClick={() => setProgramId(pg.id)}>
                <span className="ps-name">{pg.name}</span>
                <span className="ps-tag">{pg.tagline}</span>
              </button>
            ))}
          </div>

          {program.order.map(day => {
            const p = program.days[day];
            const typeCls = dayTypeClass(p.type);
            const core = coreExercises(p);
            const extras = p.exercises.filter(e => e.optional);
            return (
              <div key={day} className={`day-card ${typeCls}`}>
                <div className="day-card-head">
                  <div className="day-card-head-l">
                    <span className={`eyebrow eyebrow-${typeCls}`}>
                      {p.type === "power" ? "Power" : p.type === "fullbody" ? `Full body · ${core.length} lifts` : "Hypertrophy"}
                    </span>
                    <div className="day-card-name">{day}</div>
                    {p.description && <div className="day-card-desc">{p.description}</div>}
                  </div>
                  <button className="day-card-start" onClick={() => startSession(day)}>Start</button>
                </div>
                <div className="day-card-ex-list">
                  {core.map(ex => (
                    <div key={ex.name} className="day-ex-row">
                      <div className="ex-left">
                        {ex.name}
                        {ex.barbell && <span className="bar-tag">＋bar</span>}
                      </div>
                      <div className="ex-right">{ex.sets}×{ex.repRange}</div>
                    </div>
                  ))}
                  {extras.length > 0 && (
                    <>
                      <div className="day-ex-divider">Finishers · optional</div>
                      {extras.map(ex => (
                        <div key={ex.name} className="day-ex-row optional">
                          <div className="ex-left">{ex.name}</div>
                          <div className="ex-right">{ex.sets}×{ex.repRange}</div>
                        </div>
                      ))}
                    </>
                  )}
                </div>
              </div>
            );
          })}

          <div className="eyebrow" style={{padding:"20px 2px 0", display:"flex", justifyContent:"space-between", alignItems:"baseline"}}>
            <span>Custom sessions</span>
            <button className="more" onClick={() => { setImportOpen(true); setImportError(""); }} style={{textTransform:"none", letterSpacing:"0.12em"}}>+ Import</button>
          </div>
          {customSessions.length === 0 && (
            <div style={{color:"var(--ink-4)", fontSize:12, fontStyle:"italic", padding:"2px 2px 4px", lineHeight:1.55}}>
              One-off sessions — makeup days, recovery, running. Generate a JSON using SESSION_FORMAT.md and import it here.
            </div>
          )}
          {customSessions.map(s => {
            const typeCls = s.type === "power" ? "power" : s.type === "hypertrophy" ? "hyper" : "";
            return (
              <div key={s.id} className={`day-card ${typeCls}`}>
                <div className="day-card-head">
                  <div className="day-card-head-l">
                    <span className={`eyebrow ${typeCls?`eyebrow-${typeCls}`:""}`} style={!typeCls?{color:"var(--ink-3)"}:{}}>
                      Custom · {s.type}
                    </span>
                    <div className="day-card-name">{s.icon} {s.name}</div>
                    {s.description && <div style={{fontFamily:"var(--font-mono)", fontSize:10, color:"var(--ink-3)", marginTop:4, letterSpacing:"0.04em"}}>{s.description}</div>}
                  </div>
                  <div style={{display:"flex", gap:6, flexDirection:"column", alignItems:"flex-end"}}>
                    <button className="day-card-start" onClick={() => startSession(s.id)}>Start</button>
                    {confirmDelCustom === s.id ? (
                      <div className="del-confirm">
                        <button onClick={() => setConfirmDelCustom(null)}>cancel</button>
                        <button className="danger" onClick={() => deleteCustomSession(s.id)}>delete</button>
                      </div>
                    ) : (
                      <button className="del-btn" onClick={() => setConfirmDelCustom(s.id)}>⌫</button>
                    )}
                  </div>
                </div>
                <div className="day-card-ex-list">
                  {s.exercises.map(ex => (
                    <div key={ex.name} className="day-ex-row">
                      <div className="ex-left">
                        {ex.name}
                        {ex.barbell && <span className="bar-tag">＋bar</span>}
                      </div>
                      <div className="ex-right">{ex.sets}×{ex.repRange}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </>
      )}

      {view==="history" && (
        <>
          <div className="eyebrow" style={{padding:"0 2px"}}>Session history</div>
          {history.length===0 && <div style={{color:"var(--ink-3)", fontSize:13, padding:"6px 2px"}}>No sessions logged yet.</div>}
          {history.map(([key,log]) => {
            const p = lookupDay(log.day);
            const lt = log.type || p?.type;
            const typeCls = lt === "power" ? "power" : lt === "hypertrophy" ? "hyper" : lt === "fullbody" ? "fullbody" : "";
            const filled = Object.entries(log.exercises||{}).filter(([,sets]) => sets.some(s => s.weight||s.reps));
            const displayName = log.dayLabel || p?.name || log.day;
            return (
              <div key={key} className={`hist-card ${typeCls}`}>
                <div className="hist-card-head">
                  <div>
                    <div className="hist-card-day">
                      {displayName}
                      {log.isCustom && <span className="pill" style={{marginLeft:8, fontSize:9}}>custom</span>}
                      {log.isMakeup && <span className="pill hold" style={{marginLeft:8, fontSize:9}}>makeup</span>}
                    </div>
                    <div className="hist-card-date">{log.date}{log.durationMins > 0 ? ` · ${log.durationMins} min` : ""}</div>
                  </div>
                  {confirmDelete === key ? (
                    <div className="del-confirm">
                      <button onClick={() => setConfirmDelete(null)}>cancel</button>
                      <button className="danger" onClick={() => deleteSession(key)}>delete</button>
                    </div>
                  ) : (
                    <button className="del-btn" onClick={() => setConfirmDelete(key)}>⌫</button>
                  )}
                </div>
                {filled.map(([name,sets]) => (
                  <div key={name} className="hist-ex">
                    <span className="name">{name}</span>: <span className="sets">{sets.filter(s=>s.weight||s.reps).map(s=>`${s.weight||"?"}×${s.reps||"?"}`).join(", ")}</span>
                  </div>
                ))}
              </div>
            );
          })}
        </>
      )}

      {/* Import session modal */}
      {importOpen && (
        <div className="modal-bg" onClick={() => setImportOpen(false)}>
          <div className="modal-sheet" onClick={e => e.stopPropagation()}>
            <div className="modal-k">Import custom session</div>
            <div style={{fontSize:12, color:"var(--ink-3)", lineHeight:1.55, marginBottom:12}}>
              Paste JSON matching <code style={{color:"var(--accent)", fontFamily:"var(--font-mono)"}}>SESSION_FORMAT.md</code>. Ask a Claude session to generate one for a specific goal (makeup, recovery, running, etc.).
            </div>
            <textarea
              value={importText}
              onChange={e => { setImportText(e.target.value); setImportError(""); }}
              placeholder='{ "schemaVersion": 1, "id": "...", "name": "...", ... }'
              spellCheck={false}
              style={{
                width:"100%", minHeight:180, resize:"vertical",
                background:"var(--card-2)", border:"1px solid var(--line-2)", borderRadius:10,
                padding:12, color:"var(--ink)", fontFamily:"var(--font-mono)", fontSize:12,
                letterSpacing:"0.02em", lineHeight:1.5,
              }}
            />
            {importError && (
              <div style={{marginTop:10, padding:"10px 12px", background:"color-mix(in oklab, var(--bad) 10%, transparent)", border:"1px solid color-mix(in oklab, var(--bad) 35%, transparent)", borderRadius:8, fontSize:12, color:"var(--bad)", lineHeight:1.5}}>
                {importError}
              </div>
            )}
            <div className="btn-row" style={{marginTop:14}}>
              <button className="btn ghost" onClick={() => { setImportOpen(false); setImportText(""); setImportError(""); }}>Cancel</button>
              <button className={`btn ${importSaved?"ok":"accent"}`} onClick={handleImport} disabled={!importText.trim()}>
                {importSaved ? "Imported ✓" : "Import"}
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ─── MEAL DATABASE ───────────────────────────────────────────────────────────
// Phase multipliers: bulk boosts carbs, cut reduces them. Protein always stays.
// Each meal: { id, name, category, desc, baseKcal, baseProt, carbHeavy, tip }
// carbHeavy = true means carb portion scales with phase
const MEAL_DB_KEY = "phul_meals";

const DEFAULT_MEALS = [
  // ── FROM YOUR NUTRITIONIST PLAN (adjusted for bulk) ──
  { id:"m1",  cat:"breakfast", name:"Full Breakfast",    desc:"250ml protein milk + 1 bread 50g + 2 scrambled eggs",         baseKcal:420, baseProt:31, carbHeavy:true,  tip:"Base from your nutritionist plan. Protein milk from Mercadona." },
  { id:"m2",  cat:"post",      name:"Whey Shake",                  desc:"1 scoop whey in water or milk",                             baseKcal:130, baseProt:25, carbHeavy:false, tip:"Drink within 30min post-workout." },
  { id:"m3",  cat:"lunch",     name:"Chicken + Rice",              desc:"Soup + 175g chicken + 140g cooked rice + vegetables",          baseKcal:510, baseProt:48, carbHeavy:true,  tip:"Increase to 200g rice during bulk." },
  { id:"m4",  cat:"lunch",     name:"Tuna + Potato",               desc:"Soup + 2 tuna cans + 1 egg + 180g potato + vegetables",       baseKcal:530, baseProt:58, carbHeavy:true,  tip:"High protein — great post-workout option." },
  { id:"m5",  cat:"snack",     name:"Greek Yogurt Snack",        desc:"150g light greek yogurt + 2 tbsp muesli 0% + 1 fruit",    baseKcal:240, baseProt:12, carbHeavy:false, tip:"Add honey during bulk for easy +50 kcal." },
  { id:"m6",  cat:"snack",     name:"Protein Snack",             desc:"Liquid protein yogurt 20g + 1 bread slice + protein fresh cheese",   baseKcal:290, baseProt:31, carbHeavy:false, tip:"Good for keeping protein up between meals." },
  { id:"m7",  cat:"dinner",    name:"Dinner (same as lunch)",       desc:"Soup + 175g meat/fish + carbs + vegetables",              baseKcal:510, baseProt:48, carbHeavy:true,  tip:"Try varying the protein — salmon, cod, etc." },
  // ── BULK ADDITIONS (suggested by Claude) ──
  { id:"m8",  cat:"breakfast", name:"Bulk Breakfast+",        desc:"Protein milk + 2 breads + 3 eggs + 1 tbsp peanut butter",   baseKcal:650, baseProt:42, carbHeavy:true,  tip:"+230 kcal vs base plan. Good for training days." },
  { id:"m9",  cat:"post",      name:"Whey Shake bulk",             desc:"1 scoop whey + 50g oats + 1 banana",                      baseKcal:430, baseProt:32, carbHeavy:true,  tip:"Ideal post-workout bulk shake — replenishes glycogen fast." },
  { id:"m10", cat:"snack",     name:"Quick Bulk Snack",           desc:"2 tbsp peanut butter + 1 bread",                          baseKcal:280, baseProt:8,  carbHeavy:false, tip:"200+ kcal in 30 seconds. Good for closing a calorie gap." },
  { id:"m11", cat:"lunch",     name:"Salmon + Pasta",              desc:"Soup + 175g salmon + 140g cooked pasta + vegetables",         baseKcal:560, baseProt:44, carbHeavy:true,  tip:"Rich in omega-3. Good swap for chicken." },
  { id:"m12", cat:"snack",     name:"Cottage Cheese + Fruit",      desc:"200g cottage cheese + 1 fruit",                       baseKcal:180, baseProt:22, carbHeavy:false, tip:"High protein, low calorie cost." },
  { id:"m13", cat:"dinner",    name:"Scrambled Eggs + Sweet Potato",  desc:"3 scrambled eggs + 150g sweet potato + vegetables",              baseKcal:420, baseProt:22, carbHeavy:true,  tip:"Quick dinner when there's no time to cook." },
];

// Phase calorie multiplier for carb-heavy meals
function getMealKcal(meal, phase) {
  if (!meal.carbHeavy) return meal.baseKcal;
  return phase === "bulk"
    ? Math.round(meal.baseKcal * 1.15)   // +15% on carb meals for bulk
    : Math.round(meal.baseKcal * 0.85);  // -15% on carb meals for cut
}

const CAT_LABELS = { breakfast:"☀️ Breakfast", post:"💪 Post-Workout", lunch:"🍽 Lunch", snack:"🥜 Snack", dinner:"🌙 Dinner" };
const CAT_ORDER  = ["breakfast","post","lunch","snack","dinner"];

// ─── DIET TAB ─────────────────────────────────────────────────────────────────
function DietTab({ today, todayDiet, dietLogs, setDietLogs, phase, stats, targets, trend, setTab }) {
  // Shadow the legacy module constants with the computed values, so every
  // existing reference below picks up the personalised numbers unchanged.
  const kcalTarget = targets.target;
  const PROTEIN_G  = targets.protein;
  const [view, setView] = useState("today"); // today | library | history
  // Which date the "Today" view is currently editing. Defaults to today but can
  // walk backwards via the date nav — handles the "forgot to log yesterday" /
  // "logging after midnight" cases cleanly.
  const [editDate, setEditDate] = useState(today);
  const editDiet = dietLogs[editDate] || { kcal:0, protein:0, meals:[], extras:[] };
  const isToday = editDate === today;
  const [meals, setMeals] = useState(() => lsGet(MEAL_DB_KEY) || DEFAULT_MEALS);
  const [dayMeals, setDayMeals] = useState(() => editDiet.meals || []);
  const [manualKcal, setManualKcal] = useState({ name:"", kcal:"", prot:"" });
  const [manualProt, setManualProt] = useState("");
  const [saved, setSaved] = useState(false);
  const [showAddMeal, setShowAddMeal] = useState(false);
  const [newMeal, setNewMeal] = useState({ name:"", cat:"snack", desc:"", baseKcal:"", baseProt:"", carbHeavy:false, tip:"" });
  const [confirmDelDiet, setConfirmDelDiet] = useState(null);
  // Meal-library edit mode. `editingMealId` points at the meal being edited;
  // `editDraft` holds the in-progress edit values (applied on Save).
  const [editingMealId, setEditingMealId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);
  // Extras names the user has explicitly dismissed from the Save-as-preset
  // nudge so we don't pester them. Session-scoped — simple by design.
  const [dismissedPresetSuggestions, setDismissedPresetSuggestions] = useState([]);

  useEffect(() => { lsSet(MEAL_DB_KEY, meals); }, [meals]);

  // Toggle favorite on a library meal. Favorites pin to the top of Quick add.
  const toggleFavMeal = (id) => {
    setMeals(prev => prev.map(m => m.id === id ? { ...m, fav: !m.fav } : m));
  };
  // Begin editing a library meal — clone values into the draft so we don't
  // mutate the live meal until Save.
  const startEditMeal = (m) => {
    setEditingMealId(m.id);
    setEditDraft({
      name: m.name,
      cat: m.cat,
      desc: m.desc || "",
      baseKcal: String(m.baseKcal),
      baseProt: String(m.baseProt),
      carbHeavy: !!m.carbHeavy,
      tip: m.tip || "",
    });
  };
  const cancelEditMeal = () => { setEditingMealId(null); setEditDraft(null); };
  const saveEditMeal = () => {
    if (!editingMealId || !editDraft) return;
    if (!editDraft.name.trim() || !editDraft.baseKcal || !editDraft.baseProt) return;
    setMeals(prev => prev.map(m => m.id === editingMealId ? {
      ...m,
      name: editDraft.name.trim(),
      cat: editDraft.cat,
      desc: editDraft.desc,
      baseKcal: parseNum(editDraft.baseKcal),
      baseProt: parseNum(editDraft.baseProt),
      carbHeavy: !!editDraft.carbHeavy,
      tip: editDraft.tip,
    } : m));
    cancelEditMeal();
  };
  const deleteMeal = (id) => {
    setMeals(prev => prev.filter(m => m.id !== id));
    if (editingMealId === id) cancelEditMeal();
  };

  // Re-hydrate dayMeals whenever the edited date changes or the stored log
  // for that date mutates externally (e.g., via history delete).
  useEffect(() => {
    setDayMeals((dietLogs[editDate] || {}).meals || []);
    setSaved(false);
  }, [editDate]);

  // Compute totals for the currently-edited day
  const mealKcal = dayMeals.reduce((s,m) => {
    const found = meals.find(x => x.id === m.id);
    return s + (found ? getMealKcal(found, phase) : 0);
  }, 0);
  const mealProt = dayMeals.reduce((s,m) => {
    const found = meals.find(x => x.id === m.id);
    return s + (found ? found.baseProt : 0);
  }, 0);
  const extrasKcal = (editDiet.extras||[]).reduce((s,e)=>s+e.kcal,0);
  const extrasProt = (editDiet.extras||[]).reduce((s,e)=>s+e.prot,0);
  const totalKcal = mealKcal + extrasKcal;
  const totalProt = mealProt + extrasProt;

  const saveDay = () => {
    setDietLogs(prev => ({ ...prev, [editDate]:{ ...(prev[editDate]||{}), kcal:totalKcal, protein:totalProt, meals:dayMeals } }));
    setSaved(true); setTimeout(() => setSaved(false), 2000);
  };

  const addMealToday = (meal) => {
    setDayMeals(prev => [...prev, { id:meal.id, ts:Date.now() }]);
  };
  const removeMealFromToday = (idx) => {
    setDayMeals(prev => prev.filter((_,i) => i!==idx));
  };

  // Date nav helpers
  const shiftDate = (days) => {
    const [y,m,dd] = editDate.split("-").map(Number);
    const d = new Date(y, m-1, dd); d.setDate(d.getDate() + days);
    const next = isoLocal(d);
    if (next > today) return; // don't navigate into the future
    setEditDate(next);
  };
  const prettyDate = (iso) => {
    const [y,m,dd] = iso.split("-").map(Number);
    const d = new Date(y, m-1, dd); // parse as LOCAL date, not UTC midnight
    const wk = d.toLocaleDateString("en-US", { weekday: "short" });
    const mo = d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    return `${wk} · ${mo}`;
  };

  // Walk back from today over CONSECUTIVE calendar days; a skipped day breaks
  // the streak. An unlogged today is allowed (doesn't break it).
  let streak = 0;
  {
    const cur = new Date();
    const hit = (k) => { const l = dietLogs[k]; return !!(l && l.protein >= PROTEIN_G); };
    if (!hit(isoLocal(cur))) cur.setDate(cur.getDate() - 1);
    while (hit(isoLocal(cur))) { streak++; cur.setDate(cur.getDate() - 1); }
  }

  // 7-day grid
  const last7 = Array.from({length:7}, (_,i) => {
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = isoLocal(d);
    const log = dietLogs[key];
    return { key, log, isToday: key===today };
  }).reverse();

  // 14-day averages
  const recent14 = Object.entries(dietLogs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14);
  const avgKcal = recent14.length ? Math.round(recent14.reduce((s,[,d])=>s+(d.kcal||0),0)/recent14.length) : 0;
  const avgProt = recent14.length ? Math.round(recent14.reduce((s,[,d])=>s+(d.protein||0),0)/recent14.length) : 0;
  const surplus = avgKcal - kcalTarget;

  // ─── ROLLING 7-DAY AVERAGE ─────────────────────────────────────────────
  // Single-day intake swings enormously (820 → 3160 kcal in the same month),
  // so a daily pass/fail verdict is mostly noise and reads as constant failure.
  // Bodyweight responds to the weekly average, so that's what gets judged.
  // Unlogged days inside the window are excluded rather than counted as zero —
  // counting them as zero would punish not-logging twice.
  const roll7 = (() => {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const log = dietLogs[isoLocal(d)];
      days.push(log && (log.kcal || log.protein) ? log : null);
    }
    const logged = days.filter(Boolean);
    if (!logged.length) return { kcal: 0, protein: 0, n: 0, days };
    return {
      kcal: Math.round(logged.reduce((s, d) => s + (d.kcal || 0), 0) / logged.length),
      protein: Math.round(logged.reduce((s, d) => s + (d.protein || 0), 0) / logged.length),
      n: logged.length, days,
    };
  })();
  const rollState = roll7.n === 0 ? "none"
    : roll7.kcal >= targets.target ? "target"
    : roll7.kcal >= targets.floor  ? "floor"
    : "under";

  // ─── QUICK ADD, BUILT FROM YOUR OWN HISTORY ────────────────────────────
  // The meal library asks for per-ingredient detail; the actual logging pattern
  // is coarse and repetitive ("Lunch ~1200", "Dinner ~1200", "Shake"). Rather
  // than fight that, mine the freeform extras for repeated names and offer them
  // as one-tap buttons at the median calories/protein actually entered.
  const quickAdds = (() => {
    const byName = new Map();
    for (const log of Object.values(dietLogs)) {
      for (const e of (log.extras || [])) {
        const key = String(e.name || "").trim();
        if (!key) continue;
        if (!byName.has(key)) byName.set(key, []);
        byName.get(key).push({ kcal: num(e.kcal) || 0, prot: num(e.prot) || 0 });
      }
    }
    const median = (arr) => {
      const s = [...arr].sort((a, b) => a - b);
      return s.length % 2 ? s[(s.length-1)/2] : Math.round((s[s.length/2-1] + s[s.length/2]) / 2);
    };
    return [...byName.entries()]
      .filter(([, uses]) => uses.length >= 2)          // repeated at least once
      .map(([name, uses]) => ({
        name, uses: uses.length,
        kcal: median(uses.map(u => u.kcal)),
        prot: median(uses.map(u => u.prot)),
      }))
      .filter(q => q.kcal > 0)
      .sort((a, b) => b.uses - a.uses)
      .slice(0, 6);
  })();

  // Mirrors the extras-edit path: append, then recompute totals from meals +
  // extras rather than incrementing a stored total (which would drift).
  const addQuick = (q) => {
    const updated = [...(editDiet.extras || []), { name: q.name, kcal: q.kcal, prot: q.prot }];
    const exK = updated.reduce((s, e) => s + e.kcal, 0);
    const exP = updated.reduce((s, e) => s + e.prot, 0);
    setDietLogs(prev => ({ ...prev, [editDate]: {
      ...(prev[editDate] || {}), meals: dayMeals, extras: updated,
      kcal: mealKcal + exK, protein: mealProt + exP,
    }}));
  };

  const kcalPct = Math.min(100, (totalKcal/kcalTarget)*100);
  const protPct = Math.min(100, (totalProt/PROTEIN_G)*100);
  const kcalCls = totalKcal >= kcalTarget ? "ok" : totalKcal >= kcalTarget*0.8 ? "warn" : "bad";
  const protCls = totalProt >= PROTEIN_G ? "ok" : totalProt >= PROTEIN_G*0.8 ? "warn" : "bad";

  return (
    <>
      <div className="view-switch">
        {["today","library","history"].map(v => (
          <button key={v} className={view===v?"on":""} onClick={() => setView(v)}>
            {v==="today"?"Today":v==="library"?"Meals":"History"}
          </button>
        ))}
      </div>

      {view==="today" && (
        <>
          {/* ── Body-trend alarm ──
              The single most useful thing this tab can say. Losing lean mass on
              a bulk is a silent failure: the training log looks great while the
              result goes backwards, and nothing else in the app surfaces it. */}
          {(trend.level === "bad" || trend.level === "warn") && (
            <div className={`trend-alarm ${trend.level}`}>
              <div className="ta-head">
                <span className="ta-mark">{trend.level === "bad" ? "▲" : "!"}</span>
                <span className="ta-title">{trend.headline}</span>
              </div>
              <div className="ta-body">{trend.body}</div>
              <div className="ta-nums">
                <span>maintenance <b className="tnum">{targets.maintenance}</b></span>
                <span>target <b className="tnum">{targets.target}</b></span>
                <span>7-day avg <b className="tnum">{roll7.n ? roll7.kcal : "—"}</b></span>
              </div>
            </div>
          )}
          {trend.level === "measure" && (
            <div className="trend-alarm measure">
              <div className="ta-head">
                <span className="ta-mark">◷</span>
                <span className="ta-title">
                  {trend.stale === null ? "No body measurements yet"
                    : `Last weigh-in was ${trend.stale} days ago`}
                </span>
              </div>
              <div className="ta-body">
                Without a recent measurement none of this can tell you whether it's working.
              </div>
              <button className="ta-btn" onClick={() => setTab("stats")}>Log a weigh-in →</button>
            </div>
          )}

          {/* ── Rolling 7-day average ──
              Judged instead of the single day: bodyweight responds to the weekly
              average, and daily numbers swing far too much to mean anything. */}
          <div className="roll-card">
            <div className="section-head">
              <span className="eyebrow">7-day average</span>
              <span className="eyebrow" style={{color:"var(--ink-4)"}}>
                {roll7.n ? `${roll7.n} day${roll7.n===1?"":"s"} logged` : "nothing logged"}
              </span>
            </div>
            <div className="roll-row">
              <div className={`roll-big ${rollState}`}>
                <span className="rb-n tnum">{roll7.n ? roll7.kcal : "—"}</span>
                <span className="rb-u">kcal / day</span>
              </div>
              <div className="roll-marks">
                <div className="rm"><span className="rm-k">floor</span><span className="rm-v tnum">{targets.floor}</span></div>
                <div className="rm"><span className="rm-k">target</span><span className="rm-v tnum">{targets.target}</span></div>
                <div className="rm"><span className="rm-k">protein</span><span className="rm-v tnum">{roll7.n ? roll7.protein : "—"}<em>/{targets.proteinMin}g</em></span></div>
              </div>
            </div>
            <div className="roll-track">
              <i className="floor-mark" style={{left:`${Math.min(97,(targets.floor/(targets.target*1.25))*100)}%`}}/>
              <i className="fill" style={{width:`${Math.min(100,(roll7.kcal/(targets.target*1.25))*100)}%`}}/>
            </div>
            <div className={`roll-note ${rollState}`}>
              {rollState === "none"   ? "Log a few days and this becomes the number that matters."
             : rollState === "under"  ? `${targets.floor - roll7.kcal} kcal/day under your floor — you're eating below maintenance.`
             : rollState === "floor"  ? `Above maintenance. ${targets.target - roll7.kcal} more per day to actually grow.`
             : `On target. This is the number that moves the scale.`}
            </div>
          </div>

          {/* ── Quick add ──
              Generated from repeated freeform entries rather than the meal
              library, because that's how this actually gets logged. */}
          {quickAdds.length > 0 && (
            <div className="quick-card">
              <div className="section-head">
                <span className="eyebrow">Quick add</span>
                <span className="eyebrow" style={{color:"var(--ink-4)"}}>from what you usually eat</span>
              </div>
              <div className="quick-grid">
                {quickAdds.map(q => (
                  <button key={q.name} className="quick-btn" onClick={() => addQuick(q)}>
                    <span className="qb-name">{q.name}</span>
                    <span className="qb-nums tnum">{q.kcal}<em>kcal</em>{q.prot ? <> · {q.prot}<em>p</em></> : null}</span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Date nav — defaults to today, walks back for "forgot to log" days */}
          <div className="date-nav">
            <button className="date-nav-arrow" onClick={() => shiftDate(-1)} aria-label="Previous day">←</button>
            <div className="date-nav-label">
              <div className="dn-day">{isToday ? "Today" : prettyDate(editDate)}</div>
              <div className="dn-sub">{isToday ? prettyDate(editDate) : "editing past day"}</div>
            </div>
            <button
              className="date-nav-arrow"
              onClick={() => shiftDate(1)}
              disabled={isToday}
              aria-label="Next day"
            >→</button>
            {!isToday && (
              <button className="date-nav-today" onClick={() => setEditDate(today)}>Today</button>
            )}
          </div>

          {/* Targets card */}
          <div className="targets-card">
            <div className="targets-head">
              <div className={`targets-phase ${phase}`}>
                <div className="tk">{isToday ? "Today" : "Editing"} · {editDate}</div>
                <div className="tv">
                  <span className="ph">{phase==="bulk"?"↑ Bulk":"↓ Cut"}</span>
                  <span className="tnum">{kcalTarget}</span> kcal target
                </div>
              </div>
              {streak > 0 && isToday && (
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:20}}>🔥</div>
                  <div style={{fontSize:13, fontWeight:800, color:"var(--accent)"}}>{streak}</div>
                  <div style={{fontFamily:"var(--font-mono)", fontSize:9, color:"var(--ink-4)", letterSpacing:"0.12em", textTransform:"uppercase"}}>day streak</div>
                </div>
              )}
            </div>

            <div className="bar-row">
              <div className="bar-row-head">
                <span className="bar-row-k">Calories</span>
                <span className={`bar-row-v ${kcalCls}`}>
                  <span className="tnum">{totalKcal}</span>
                  <span className="tot">/ {kcalTarget}</span>
                </span>
              </div>
              <div className="bar-fat"><i className={kcalCls} style={{width:`${kcalPct}%`}}/></div>
              {totalKcal > kcalTarget && (
                <div className="bar-note warn">+{totalKcal-kcalTarget} kcal over target</div>
              )}
            </div>

            <div className="bar-row">
              <div className="bar-row-head">
                <span className="bar-row-k">Protein</span>
                <span className={`bar-row-v ${protCls}`}>
                  <span className="tnum">{totalProt}g</span>
                  <span className="tot">/ {PROTEIN_G}g</span>
                </span>
              </div>
              <div className="bar-fat"><i className={protCls} style={{width:`${protPct}%`, background:"var(--info)"}}/></div>
              <div className="bar-note">
                {(totalProt / (stats[stats.length-1]?.weight||74)).toFixed(1)}g/kg bodyweight
                {totalProt >= PROTEIN_G ? " ✓" : ` — need ${PROTEIN_G-totalProt}g more`}
              </div>
            </div>
          </div>

          {/* Day's meals */}
          <div className="card">
            <div className="section-head">
              <span className="eyebrow">{isToday ? "Today's" : "Day's"} meals</span>
              <button className="more" onClick={() => setView("library")}>+ Add</button>
            </div>
            {dayMeals.length === 0 && (
              <div style={{fontSize:13, color:"var(--ink-4)", textAlign:"center", padding:"14px 0"}}>
                No meals yet. Go to Meals to add.
              </div>
            )}
            {dayMeals.map((tm, i) => {
              const m = meals.find(x => x.id===tm.id);
              if (!m) return null;
              return (
                <div key={i} className="meal-row">
                  <div className="meal-row-l">
                    <div className="meal-row-name">{m.name}</div>
                    <div className="meal-row-sub">{getMealKcal(m,phase)} kcal · {m.baseProt}g protein</div>
                  </div>
                  <button className="meal-x" onClick={() => removeMealFromToday(i)}>×</button>
                </div>
              );
            })}
            <div className="qa-head">Quick add</div>
            <div className="qa-chips">
              {(() => {
                // Score meals by: favorites first, then usage count over the
                // last 14 days of logs, then most-recent use. Surfaces what
                // the user actually reaches for — not a stale category order.
                const since = Date.now() - 14 * 86400000;
                const sinceIso = new Date(since).toISOString().slice(0,10);
                const useCount = {};
                const lastUsed = {};
                for (const [date, log] of Object.entries(dietLogs)) {
                  if (date < sinceIso) continue;
                  for (const tm of (log.meals || [])) {
                    useCount[tm.id] = (useCount[tm.id] || 0) + 1;
                    lastUsed[tm.id] = Math.max(lastUsed[tm.id] || 0, tm.ts || 0);
                  }
                }
                const ranked = [...meals].sort((a, b) => {
                  if (!!b.fav - !!a.fav) return (!!b.fav) - (!!a.fav);
                  const ca = useCount[a.id] || 0, cb = useCount[b.id] || 0;
                  if (cb !== ca) return cb - ca;
                  return (lastUsed[b.id] || 0) - (lastUsed[a.id] || 0);
                });
                return ranked.slice(0, 6).map(m => (
                  <button key={m.id} className={`qa-chip${m.fav?" fav":""}`} onClick={() => addMealToday(m)}>
                    {m.fav && <span style={{color:"var(--accent-gold)", marginRight:2}}>★</span>}+ {m.name}
                  </button>
                ));
              })()}
              <button className="qa-chip dashed" onClick={() => setView("library")}>see all →</button>
            </div>
          </div>

          {/* Extras */}
          <div className="card">
            <div className="section-head">
              <span className="eyebrow">Extras</span>
              <span className="eyebrow" style={{color:"var(--ink-4)"}}>off-library items</span>
            </div>
            {/* Save-as-preset nudge: any extras name logged ≥3x in the last 14 days
                that doesn't already exist as a library meal. Shown one at a time. */}
            {(() => {
              const since = Date.now() - 14 * 86400000;
              const sinceIso = new Date(since).toISOString().slice(0,10);
              const byName = {};
              for (const [date, log] of Object.entries(dietLogs)) {
                if (date < sinceIso) continue;
                for (const ex of (log.extras || [])) {
                  const key = (ex.name || "").trim().toLowerCase();
                  if (!key) continue;
                  byName[key] = byName[key] || { name: ex.name, count: 0, kcals: [], prots: [] };
                  byName[key].count++;
                  byName[key].kcals.push(ex.kcal || 0);
                  byName[key].prots.push(ex.prot || 0);
                }
              }
              const existingLower = new Set(meals.map(m => m.name.toLowerCase()));
              const candidates = Object.entries(byName)
                .filter(([k, v]) => v.count >= 3
                  && !existingLower.has(k)
                  && !dismissedPresetSuggestions.includes(k))
                .sort((a,b) => b[1].count - a[1].count);
              if (!candidates.length) return null;
              const [key, info] = candidates[0];
              const avgK = Math.round(info.kcals.reduce((s,x)=>s+x,0) / info.kcals.length);
              const avgP = Math.round(info.prots.reduce((s,x)=>s+x,0) / info.prots.length);
              return (
                <div className="preset-suggest">
                  <div className="ps-text">
                    You logged <strong>{info.name}</strong> {info.count}× recently — save it to the library?
                    <div style={{marginTop:3, fontSize:10, fontFamily:"var(--font-mono)", color:"var(--ink-4)", letterSpacing:"0.06em"}}>
                      avg {avgK} kcal · {avgP}g prot
                    </div>
                  </div>
                  <div className="ps-actions">
                    <button onClick={() => setDismissedPresetSuggestions(p => [...p, key])}>Skip</button>
                    <button className="save" onClick={() => {
                      const m = {
                        id: "m" + Date.now(),
                        name: info.name,
                        cat: "snack",
                        desc: "saved from extras",
                        baseKcal: avgK,
                        baseProt: avgP,
                        carbHeavy: false,
                        tip: "",
                      };
                      setMeals(prev => [...prev, m]);
                      setDismissedPresetSuggestions(p => [...p, key]);
                    }}>Save</button>
                  </div>
                </div>
              );
            })()}
            {(editDiet.extras||[]).map((ex,i) => (
              <div key={i} className="meal-row">
                <div className="meal-row-l">
                  <div className="meal-row-name">{ex.name||"Extra"}</div>
                  <div className="meal-row-sub">{ex.kcal} kcal · {ex.prot}g protein</div>
                </div>
                <button className="meal-x" onClick={() => {
                  const updated = (editDiet.extras||[]).filter((_,idx)=>idx!==i);
                  const exK = updated.reduce((s,e)=>s+(e.kcal||0),0), exP = updated.reduce((s,e)=>s+(e.prot||0),0);
                  setDietLogs(prev => ({ ...prev, [editDate]:{ ...prev[editDate]||{}, meals:dayMeals, extras:updated, kcal: mealKcal+exK, protein: mealProt+exP } }));
                }}>×</button>
              </div>
            ))}
            <div className="extras-form">
              <div>
                <label>Name</label>
                <input value={manualKcal.name||""} onChange={e=>setManualKcal(p=>({...p,name:e.target.value}))} placeholder="banana" type="text"/>
              </div>
              <div>
                <label>Kcal</label>
                <input className="num" value={manualKcal.kcal||""} onChange={e=>setManualKcal(p=>({...p,kcal:e.target.value}))} placeholder="100" type="text" inputMode="decimal"/>
              </div>
              <div>
                <label>Prot g</label>
                <input className="num" value={manualKcal.prot||""} onChange={e=>setManualKcal(p=>({...p,prot:e.target.value}))} placeholder="0" type="text" inputMode="decimal"/>
              </div>
              <button className="add" onClick={() => {
                const k = parseNum(manualKcal.kcal)||0;
                if (!k) return;
                const item = { name: manualKcal.name||"Extra", kcal:k, prot:parseNum(manualKcal.prot)||0 };
                const updated = [...(editDiet.extras||[]), item];
                const exK = updated.reduce((s,e)=>s+(e.kcal||0),0), exP = updated.reduce((s,e)=>s+(e.prot||0),0);
                setDietLogs(prev => ({ ...prev, [editDate]:{ ...prev[editDate]||{}, meals:dayMeals, extras:updated, kcal: mealKcal+exK, protein: mealProt+exP } }));
                setManualKcal({ name:"", kcal:"", prot:"" });
              }}>+</button>
            </div>
          </div>

          <button className={`btn ${saved?"ghost":"accent"} huge`} onClick={saveDay}>
            {saved ? "Saved ✓" : (isToday ? "Save day" : `Save ${editDate}`)}
          </button>

          {/* 7-day grid */}
          <div className="card">
            <div className="section-head">
              <span className="eyebrow">Last 7 days</span>
            </div>
            <div className="d7-grid">
              {last7.map(({key,log,isToday}) => {
                const hitKcal = log && log.kcal >= kcalTarget;
                const hitProt = log && log.protein >= PROTEIN_G;
                const cellCls = !log ? "empty" : hitKcal && hitProt ? "ok" : hitProt ? "half" : "bad";
                const [ky,km,kd] = key.split("-").map(Number); const day = new Date(ky, km-1, kd).toLocaleDateString("en-US",{weekday:"short"}).slice(0,1).toUpperCase();
                return (
                  <div key={key} className={`d7-cell ${cellCls} ${isToday?"today":""}`}>
                    <div className="dow">{day}</div>
                    <div className="dot"/>
                    {log && <div className="d7-v">{Math.round(log.protein)}g</div>}
                  </div>
                );
              })}
            </div>
            <div className="d7-legend">
              <span><i className="sw ok"/>both</span>
              <span><i className="sw half"/>protein</span>
              <span><i className="sw bad"/>missed</span>
            </div>
          </div>

          {/* 14-day summary */}
          {recent14.length > 0 && (
            <div className="card">
              <div className="section-head">
                <span className="eyebrow">14-day average</span>
              </div>
              <div className="summary-grid">
                <div className="summary-cell">
                  <div className="sk">Kcal</div>
                  <div className={`sv tnum ${avgKcal>=kcalTarget?"ok":"warn"}`}>{avgKcal}</div>
                </div>
                <div className="summary-cell">
                  <div className="sk">Protein</div>
                  <div className={`sv tnum ${avgProt>=PROTEIN_G?"ok":"warn"}`}>{avgProt}g</div>
                </div>
                <div className="summary-cell">
                  <div className="sk">Surplus</div>
                  <div className={`sv tnum ${surplus>0?"bad":surplus<-200?"info":"ok"}`}>{surplus>0?"+":""}{surplus}</div>
                </div>
              </div>
              {avgKcal < kcalTarget - 200 && (
                <div className="insight-box">
                  ⚠ Average {kcalTarget-avgKcal} kcal below target. {phase==="bulk"?"This explains any lean-mass loss.":"Check your deficit isn't too aggressive."}
                </div>
              )}
              {avgKcal >= kcalTarget && avgProt >= PROTEIN_G && (
                <div className="insight-box ok">✓ Consistently hitting targets. Keep it up.</div>
              )}
            </div>
          )}
        </>
      )}

      {view==="library" && (
        <>
          <div className="card">
            <div className="section-head">
              <span className="eyebrow">Meal library</span>
              <span className="eyebrow" style={{color:"var(--ink-4)"}}>carbs adjust for {phase}</span>
            </div>
            {CAT_ORDER.map(cat => {
              const catMeals = meals.filter(m => m.cat===cat);
              if (!catMeals.length) return null;
              // Favorites pin to the top within each category.
              const sortedCat = [...catMeals].sort((a,b) => (!!b.fav) - (!!a.fav));
              return (
                <div key={cat} style={{marginBottom:18}}>
                  <div className="meal-cat">{CAT_LABELS[cat]}</div>
                  {sortedCat.map(m => {
                    if (editingMealId === m.id && editDraft) {
                      return (
                        <div key={m.id} className="add-meal-form" style={{marginBottom:8}}>
                          <div className="eyebrow" style={{marginBottom:12}}>Edit meal</div>
                          {[
                            { label:"Name",         key:"name", ph:"Chicken + quinoa" },
                            { label:"Description",  key:"desc", ph:"Ingredients + quantities" },
                            { label:"Tip (optional)", key:"tip", ph:"Context / pairing" },
                          ].map(f => (
                            <div key={f.key} style={{marginBottom:10}}>
                              <label>{f.label}</label>
                              <input value={editDraft[f.key]} onChange={e => setEditDraft(p=>({...p,[f.key]:e.target.value}))} placeholder={f.ph} type="text"/>
                            </div>
                          ))}
                          <div className="amf-row">
                            <div>
                              <label>Kcal</label>
                              <input value={editDraft.baseKcal} onChange={e => setEditDraft(p=>({...p,baseKcal:e.target.value}))} placeholder="500" type="text" inputMode="decimal" style={{textAlign:"center"}}/>
                            </div>
                            <div>
                              <label>Prot g</label>
                              <input value={editDraft.baseProt} onChange={e => setEditDraft(p=>({...p,baseProt:e.target.value}))} placeholder="40" type="text" inputMode="decimal" style={{textAlign:"center"}}/>
                            </div>
                            <div>
                              <label>Category</label>
                              <select value={editDraft.cat} onChange={e => setEditDraft(p=>({...p,cat:e.target.value}))}>
                                {CAT_ORDER.map(c => <option key={c} value={c}>{c}</option>)}
                              </select>
                            </div>
                          </div>
                          <div className="amf-check">
                            <input type="checkbox" checked={editDraft.carbHeavy} onChange={e => setEditDraft(p=>({...p,carbHeavy:e.target.checked}))} id={`carb-${m.id}`}/>
