<div id="root"></div>
<!-- React + Babel served from same origin (Netlify) to avoid CDN-unreachable
     failure modes at the gym. Matches versions previously loaded from cdnjs. -->
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/babel.min.js"></script>

<!-- Service worker: caches shell + vendor for true offline support and
     near-zero host bandwidth after first load. -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(err => {
        console.warn("SW registration failed:", err);
      });
    });
  }
</script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── LOCALSTORAGE HELPERS ─────────────────────────────────────────────────────
function lsGet(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; }
}
function lsSet(key, val) {
  try {
    if (val === null) { localStorage.removeItem(key); }
    else { localStorage.setItem(key, JSON.stringify(val)); }
    return true;
  } catch (e) {
    // Don't fail silently — a swallowed write means lost data with a misleading
    // "saved" UI. Warn always; alert on quota so the user can export + free space.
    console.warn("lsSet failed for", key, e);
    if (e && (e.name === "QuotaExceededError" || e.code === 22 || e.code === 1014)) {
      try { alert("Storage is full — your latest change may not have saved. Export a backup from the Body tab and free up space."); } catch {}
    }
    return false;
  }
}

// Local calendar date as YYYY-MM-DD. NOT toISOString() (which is UTC and files
// after-midnight entries on the wrong day for anyone east/west of UTC).
function isoLocal(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function todayStr() { return isoLocal(new Date()); }

// ─── NUMERIC PARSING ──────────────────────────────────────────────────────────
// Weights and reps are stored as strings typed on a phone keyboard, so they can
// carry a comma decimal ("17,5") from a locale keypad. parseFloat("17,5") is 17
// — a silent 0.5kg data loss that then propagates through every progression
// calculation. Always parse through num().
function num(v) {
  if (typeof v === "number") return Number.isFinite(v) ? v : NaN;
  if (typeof v !== "string") return NaN;
  const n = parseFloat(v.replace(",", "."));
  return Number.isFinite(n) ? n : NaN;
}
// A set only counts toward progression if it carries a real weight AND real reps.
// Reps of 0 means the set was attempted and missed entirely — it's a note to self,
// not a data point, and feeding it to the decision tree reads as a catastrophic
// failure and triggers a deload the lifter didn't earn.
function isScorable(s) {
  const w = num(s?.weight), r = num(s?.reps);
  return w > 0 && Number.isFinite(r) && r > 0;
}

// ─── ONE-TIME DATA MIGRATION ──────────────────────────────────────────────────
// Repairs historical damage from earlier versions. Idempotent and version-stamped
// so it runs once. Each fix corresponds to a real corruption found in live data:
//   1. comma decimals stored raw ("17,5" read back as 17kg)
//   2. 0-rep sets stored with done:true (scored as total failure → phantom deloads)
//   3. stranded makeup drafts left behind by abandoned catch-up sessions
const MIGRATION_KEY = "phul_migration_v";
const MIGRATION_VERSION = 1;
function runMigrations() {
  if ((lsGet(MIGRATION_KEY) || 0) >= MIGRATION_VERSION) return null;
  const report = { commas: 0, zeroReps: 0, drafts: 0 };

  const logs = lsGet("phul_logs");
  if (logs && typeof logs === "object") {
    for (const session of Object.values(logs)) {
      for (const sets of Object.values(session?.exercises || {})) {
        if (!Array.isArray(sets)) continue;
        for (const s of sets) {
          if (typeof s?.weight === "string" && s.weight.includes(",")) {
            s.weight = s.weight.replace(",", ".");
            report.commas++;
          }
          // Un-complete 0-rep sets rather than deleting them: the lifter's intent
          // ("I tried this and got nothing") is preserved in history, it just
          // stops counting as a scored failure.
          if (s?.done && num(s.reps) === 0) {
            s.done = false;
            report.zeroReps++;
          }
        }
      }
    }
    lsSet("phul_logs", logs);
  }

  // Drop makeup drafts with nothing actually logged in them — these are the
  // residue of a catch-up that was opened and never started.
  const drafts = lsGet("phul_makeup_draft");
  if (drafts && typeof drafts === "object") {
    const kept = {};
    for (const [k, d] of Object.entries(drafts)) {
      const touched = Object.values(d?.data || {}).some(sets =>
        Array.isArray(sets) && sets.some(s => s?.done || String(s?.weight || "").trim() || String(s?.reps || "").trim()));
      if (touched) kept[k] = d; else report.drafts++;
    }
    lsSet("phul_makeup_draft", Object.keys(kept).length ? kept : null);
  }

  lsSet(MIGRATION_KEY, MIGRATION_VERSION);
  const total = report.commas + report.zeroReps + report.drafts;
  return total ? report : null;
}
const MIGRATION_REPORT = runMigrations();

// ─── EQUIPMENT & PROGRESSION ──────────────────────────────────────────────────
function getEquipmentType(exName) {
  const barbell = ["Bench Press","OHP","Bent Over Row","Squat","Deadlift","Incline Barbell Press","Skull Crushers","EZ Bar Curl","Romanian Deadlift","Front Squat"];
  const machine  = ["Leg Press","Lat Pulldown","Seated Cable Row","Leg Curl","Leg Extension","Calf Raise","Cable Fly","Face Pull","Tricep Pushdown","Hip Thrust","Hack Squat / Leg Press","Seated Calf Raise"];
  const dbLight  = ["DB Lateral Raise","Incline DB Curl","Rear Delt Fly","Hammer Curl","DB Curl"];
  if (barbell.includes(exName)) return "barbell";
  if (machine.includes(exName)) return "machine";
  if (dbLight.includes(exName)) return "dumbbell_light";
  return "dumbbell_heavy";
}
function getBaseIncrement(t) {
  if (t === "barbell") return 2.5;
  if (t === "dumbbell_heavy") return 2.5;
  if (t === "dumbbell_light") return 1;
  if (t === "machine") return 5;
  return 2.5;
}
function snapDB(weight) {
  if (weight <= 10) return Math.round(weight);
  return Math.round(weight / 2.5) * 2.5;
}
function snap(weight, equipType) {
  if (equipType === "dumbbell_heavy" || equipType === "dumbbell_light") return snapDB(weight);
  const step = getBaseIncrement(equipType);
  return Math.round(weight / step) * step;
}
function dbIncrement(currentWeight) {
  return currentWeight <= 10 ? 1 : 2.5;
}
function avgReps(sets) {
  const f = sets.filter(s => s.reps && !isNaN(parseInt(s.reps)));
  if (!f.length) return null;
  return f.reduce((s, x) => s + parseInt(x.reps), 0) / f.length;
}
// How much to discount an old result. A weight you last touched four months ago
// is not a weight you can walk in and hit today — but it isn't gone either.
// Retraining literature is consistent: restart at roughly 50–70% and the gap
// closes in weeks, not months, because the muscle keeps its myonuclei.
function stalenessFactor(days) {
  if (days <= 21)  return 1;
  if (days <= 35)  return 0.90;
  if (days <= 60)  return 0.82;
  if (days <= 120) return 0.72;
  return 0.65;
}

// Position of an exercise within its session, 0 (first) → 1 (last). Used to tell
// "this weight is too heavy" apart from "you did this at minute 85 of a 95-minute
// session." The two look identical in the rep data and are not the same problem.
function sessionPosition(session, exName) {
  const names = Object.keys(session?.exercises || {});
  const i = names.indexOf(exName);
  return (i < 0 || names.length < 2) ? 0 : i / (names.length - 1);
}

function calcNextWeight(exercise, logs) {
  const eq = getEquipmentType(exercise.name);
  const baseInc = getBaseIncrement(eq);
  // Lowest sane suggestion: one increment. NOT the bar weight — barbell loads
  // here are PLATE weight with the bar excluded, so clamping at barWeight would
  // put a floor of 20kg of plates (60kg total) under every barbell lift and make
  // a genuine deload impossible on the lighter ones.
  const minWeight = baseInc;
  const [minR, maxR] = exercise.repRange.split("-").map(Number);

  // ─── Pull last 3 same-day sessions (only those with actual logged data for this exercise) ──
  // Skip sessions where THIS exercise was abandoned — 1 set of 24 reps from an
  // abandoned Cable Fly isn't "crushing 3 sets", it's partial data that would
  // misfire the crush/progress branches. The partial data is still in the log
  // for reference; it just doesn't drive the weight suggestion.
  const history = [];
  for (const [, session] of Object.entries(logs).sort((a,b) => b[1].ts - a[1].ts)) {
    if (session.day === exercise.day) {
      if (session.abandoned?.includes(exercise.name)) continue;
      const sets = session.exercises?.[exercise.name];
      if (sets?.length > 0 && sets.some(isScorable)) {
        history.push({ sets, ts: session.ts, pos: sessionPosition(session, exercise.name) });
      }
      if (history.length >= 3) break;
    }
  }

  if (!history.length) {
    // No history on this exercise in this session type. If the exercise declares
    // where it came from (seedFrom), carry the load across from the old program
    // instead of dumping the lifter back on a generic startWeight.
    const seeded = computeRestartWeight(exercise, logs);
    if (seeded) return seeded;

    // Otherwise check whether an abandoned session remembers a weight. Partial
    // data shouldn't drive progression, but it IS a record of "this is what you
    // last had loaded."
    for (const [, session] of Object.entries(logs).sort((a,b) => b[1].ts - a[1].ts)) {
      if (session.day !== exercise.day) continue;
      const sets = session.exercises?.[exercise.name];
      if (!sets?.length) continue;
      const filled = sets.filter(s => num(s.weight) > 0);
      if (!filled.length) continue;
      const w = snap(num(filled[0].weight), eq);
      return {
        weight: w, status: "hold-partial", increment: baseInc, eq,
        note: `→ ${w}kg — you only got partway through this last time. Finish the sets this round.`
      };
    }
    return { weight: exercise.startWeight, status: "start", increment: baseInc, eq, note: `Start: ${exercise.startWeight}kg` };
  }

  const lastSets    = history[0].sets;
  const filledLast  = lastSets.filter(isScorable);
  if (!filledLast.length) {
    return { weight: exercise.startWeight, status: "start", increment: baseInc, eq, note: "No data yet" };
  }

  // ─── Working weight = the weight actually WORKED at ─────────────────────
  // Not the first set's weight. Anchoring on set 1 misreads both common patterns:
  // ramping up (40, 50, 50 → judged as 40) and dropping down after a failed top
  // set (60, 50, 50 → judged only on the 60 that got missed). The weight that
  // appears on the most sets is the working weight; heaviest breaks ties.
  const weightCounts = new Map();
  for (const s of filledLast) {
    const w = num(s.weight);
    weightCounts.set(w, (weightCounts.get(w) || 0) + 1);
  }
  let lastWeight = NaN, bestCount = -1;
  for (const [w, c] of weightCounts) {
    if (c > bestCount || (c === bestCount && w > lastWeight)) { lastWeight = w; bestCount = c; }
  }
  if (!(lastWeight > 0)) { // non-numeric / ≤0 weight — don't propagate NaN into a suggestion
    return { weight: exercise.startWeight, status: "start", increment: baseInc, eq, note: `Start: ${exercise.startWeight}kg` };
  }
  const judgeSets = filledLast.filter(s => Math.abs(num(s.weight) - lastWeight) < 1e-9);
  const reps      = judgeSets.map(s => num(s.reps)).filter(Number.isFinite);
  const setCount  = reps.length;
  if (!setCount) {
    const w = snap(lastWeight, eq);
    return { weight: w, status: "same", increment: baseInc, eq, note: `→ ${w}kg — log clean sets at this weight.` };
  }

  // ─── Performance metrics ───────────────────────────────────────────────
  const totalReps        = reps.reduce((a, b) => a + b, 0);
  const targetReps       = maxR * setCount;    // ideal: all sets at top
  const minTotalReps     = minR * setCount;    // floor: all sets at bottom
  const span             = Math.max(1, targetReps - minTotalReps);
  const perf             = (totalReps - minTotalReps) / span; // 1.0 = all top, 0 = all bottom, <0 = fails
  const worstReps        = Math.min(...reps);
  const worstDeficit     = Math.max(0, minR - worstReps);
  const failedSets       = reps.filter(r => r < minR).length;
  const allTop           = reps.every(r => r >= maxR);
  // Excess measured on the WEAKEST set, not the total. A single big last set is
  // a burnout/AMRAP set, not evidence the load was light: 5,5,12 on a 3-5 range
  // used to sum to "+7 over top" and fire a double-increment every session,
  // which walked the weight up far past what three honest sets could hold.
  const minOverTop       = Math.max(0, worstReps - maxR);
  // A wide rep spread across sets at the same weight means the last set was a
  // burnout, not a working set. When that's the pattern, average RPE stops being
  // a trustworthy "was this easy?" signal — the prescribed sets can read as easy
  // purely because the finisher inflated the rep count.
  const repSpread        = Math.max(...reps) - worstReps;
  const burnoutPattern   = repSpread >= Math.max(3, (maxR - minR) + 2);

  // ─── Fatigue context ────────────────────────────────────────────────────
  // An exercise done at the end of a long session is being judged on a tired
  // body. Failing reps there is a scheduling fact, not a strength fact, and
  // deloading for it walks accessory weights down session after session while
  // the compounds at the front keep climbing.
  const lateInSession    = history[0].pos >= 0.5;
  const fatigueSuspect   = lateInSession && (exercise.tier || 3) >= 2;

  // ─── RPE signal (optional) ──────────────────────────────────────────────
  // RPE is logged per set but may be absent (older logs, or you didn't tap it).
  // When present it refines push/hold calls: low effort → room to add load;
  // near-max effort → consolidate. avgRpe stays null when no set carried an RPE,
  // and every branch below then behaves exactly as the rep-only version did.
  const rpeVals = filledLast.map(s => s.rpe).filter(v => typeof v === "number" && v > 0);
  const avgRpe  = rpeVals.length ? rpeVals.reduce((a, b) => a + b, 0) / rpeVals.length : null;
  const rpeShow = avgRpe !== null ? Math.round(avgRpe * 2) / 2 : null; // nearest 0.5, for notes
  const rpeEasy = avgRpe !== null && avgRpe <= 7;    // ≈3+ reps left — clear room to progress
  // Target band is RIR 1–3 (RPE 7–9). Meta-analysis is clear that sets taken to
  // momentary failure don't grow more muscle than sets left 1–3 short, they just
  // cost more fatigue — which is the thing that ends training blocks.
  const grinding = avgRpe !== null && avgRpe >= 9.5; // ~0 reps left — back off pushing

  // ─── Stall counter: consecutive sessions at same weight without hitting top ──
  let stallCount = 0;
  for (const h of history) {
    const sFilled = h.sets.filter(isScorable);
    if (!sFilled.length) break;
    if (Math.abs(num(sFilled[0].weight) - lastWeight) > 1e-9) break;
    const sReps = sFilled.map(s => num(s.reps));
    if (sReps.every(r => r >= maxR)) break; // crushed it — not a stall
    stallCount++;
  }

  // ─── Layoff detection ───────────────────────────────────────────────────
  const daysSince = Math.max(0, Math.floor((Date.now() - (history[0].ts || Date.now())) / 86400000));
  const stale     = daysSince > 21;

  // ─── Deload helper ───────────────────────────────────────────────────────
  // A deload must actually reduce the load: at light weights a raw -7/-10/-15%
  // can round back to the same number, so force at least one increment down and
  // clamp to a sane floor (empty bar / one increment) — never 0kg.
  const dropTo = (p) =>
    Math.max(minWeight, Math.min(snap(lastWeight * p, eq), snap(lastWeight - baseInc, eq)));

  // ─── DECISION TREE (priority order, first match wins) ──────────────────
  const decide = () => {

  // 1. CRUSH — EVERY set beat the top of the range. Measured on the weakest set
  //    so one big finisher set can't manufacture a double jump on its own.
  if (allTop && minOverTop >= 1) {
    const inc  = grinding ? baseInc : baseInc * 2;   // near-max effort → temper the jump
    const next = snap(lastWeight + inc, eq);
    return {
      weight: next, status: "crush", increment: inc, eq,
      note: grinding
        ? `↑ +${inc}kg — every set beat ${maxR} reps, but at RPE ~${rpeShow}. Solid bump.`
        : `↑↑ +${inc}kg — every set beat ${maxR} reps. Big jump.`
    };
  }

  // 2. PROGRESS — all sets hit top
  if (allTop) {
    // Hit every top rep AND it felt easy → there's clear headroom, jump harder.
    if (rpeEasy && !burnoutPattern) {
      const next = snap(lastWeight + baseInc * 2, eq);
      return {
        weight: next, status: "crush", increment: baseInc * 2, eq,
        note: `↑↑ +${baseInc*2}kg — all sets at ${maxR} reps, RPE ~${rpeShow} (easy). Jump.`
      };
    }
    const next = snap(lastWeight + baseInc, eq);
    return {
      weight: next, status: "increase", increment: baseInc, eq,
      note: grinding
        ? `↑ +${baseInc}kg — all sets hit ${maxR}. You're at RPE ~${rpeShow} though — stop a rep earlier this time.`
        : `↑ +${baseInc}kg — all sets hit ${maxR} reps.`
    };
  }

  // 2a. CLEAN PROGRESS — every set landed inside the range, nothing failed, and
  //     it was done at or under the effort target. Under the leave-2-reps
  //     protocol for compounds this IS the success condition: without this
  //     branch the only route to more weight is hitting the top of the range on
  //     every set, which can only be done by training to failure — so the
  //     algorithm would be quietly punishing the exact behaviour it asks for.
  //     Requires mid-range or better, so it builds reps before it adds load.
  if (failedSets === 0 && (exercise.tier || 3) <= 2 && avgRpe !== null && avgRpe <= 8 && perf >= 0.5) {
    const next = snap(lastWeight + baseInc, eq);
    if (next > lastWeight) {
      return {
        weight: next, status: "increase", increment: baseInc, eq,
        note: `↑ +${baseInc}kg — all sets in range at RPE ~${rpeShow}, nothing forced. That's how it should look.`
      };
    }
  }

  // 2b. FATIGUE HOLD — this exercise sits late in the session and had a bad
  //     round, but only one. Almost always the session catching up with you
  //     rather than the load being wrong. Hold once; if it repeats, the deload
  //     branches below still fire on the next pass.
  // stallCount includes the session being judged, so it is already ≥1 whenever
  // this round fell short — "< 2" is the first-offence test, not "< 1".
  if (fatigueSuspect && failedSets >= 1 && stallCount < 2) {
    return {
      weight: lastWeight, status: "fatigue-hold", increment: baseInc, eq,
      note: `→ ${lastWeight}kg — rough round, but this comes late in the session. Same weight, fresher legs.`
    };
  }

  // 3. HARD DELOAD — 2+ fails with significant deficit
  if (failedSets >= 2 && worstDeficit >= 2) {
    const drop = dropTo(0.85);
    return {
      weight: drop, status: "deload", increment: baseInc, eq,
      note: `↓ ${drop}kg — ${failedSets} sets came up short. Back off, rebuild, come back through it.`
    };
  }

  // 4. DELOAD — 2+ fails, mild
  if (failedSets >= 2) {
    const drop = dropTo(0.90);
    return {
      weight: drop, status: "deload", increment: baseInc, eq,
      note: `↓ ${drop}kg — ${failedSets} sets under ${minR}. Small back-off.`
    };
  }

  // 5. STEP DOWN — 1 fail, deficit ≥2 reps (weight was too heavy on one set)
  if (failedSets === 1 && worstDeficit >= 2) {
    const drop = Math.max(minWeight, snap(lastWeight - baseInc, eq));
    return {
      weight: drop, status: "step-down", increment: baseInc, eq,
      note: `↓ -${baseInc}kg — one set hit ${worstReps}. One step back.`
    };
  }

  // 6. STALL RESET — held same weight for 2+ sessions without hitting top
  if (stallCount >= 2) {
    const drop = dropTo(0.93);
    return {
      weight: drop, status: "stall-reset", increment: baseInc, eq,
      note: `↓ ${drop}kg — ${stallCount+1} sessions at the same weight. Reset and run it back up.`
    };
  }

  // 7. GRIND HOLD — 1 fail but deficit is just 1 rep (grind through next time)
  if (failedSets === 1 && worstDeficit === 1) {
    return {
      weight: lastWeight, status: "grind", increment: baseInc, eq,
      note: `→ ${lastWeight}kg — one set hit ${worstReps}. One more rep and it's yours.`
    };
  }

  // 8. STRONG HOLD — no fails, close to top.
  if (perf >= 0.75) {
    // Close to top AND it felt easy → don't sit here, add load now.
    if (rpeEasy) {
      const inc  = eq === "dumbbell_light" ? dbIncrement(lastWeight) : baseInc;
      const next = snap(lastWeight + inc, eq);
      if (next > lastWeight) {
        return {
          weight: next, status: "increase", increment: inc, eq,
          note: `↑ +${inc}kg — ${Math.round(perf*100)}% of target at RPE ~${rpeShow} (easy). Room to climb.`
        };
      }
    }
    // Near-max effort already → consolidate this weight before adding load.
    if (grinding) {
      return {
        weight: lastWeight, status: "same", increment: baseInc, eq,
        note: `→ ${lastWeight}kg — ${Math.round(perf*100)}% of target at RPE ~${rpeShow}. Own this weight before adding.`
      };
    }
    // Micro-progression for light dumbbells (rep-only default).
    if (eq === "dumbbell_light") {
      const microInc = dbIncrement(lastWeight);
      const next = snap(lastWeight + microInc, eq);
      if (next > lastWeight) {
        return {
          weight: next, status: "micro-up", increment: microInc, eq,
          note: `↑ +${microInc}kg — strong session (${Math.round(perf*100)}% of target).`
        };
      }
    }
    return {
      weight: lastWeight, status: "same", increment: baseInc, eq,
      note: `→ ${lastWeight}kg — ${Math.round(perf*100)}% of target. Push for top.`
    };
  }

  // 9. HOLD — catchall for "not all top, but no failures"
  return {
    weight: lastWeight, status: "same", increment: baseInc, eq,
    note: `→ ${lastWeight}kg — ${Math.round(perf*100)}% of target.`
  };
  };

  const result = decide();

  // ─── Layoff override ────────────────────────────────────────────────────
  // Everything above assumes the last session was recent. It wasn't. Handing
  // back a weight from months ago is how a comeback session turns into a failed
  // session turns into another month off — so scale the suggestion to the gap
  // and say plainly that it's deliberate.
  if (stale) {
    const scaled = Math.max(minWeight, snap(result.weight * stalenessFactor(daysSince), eq));
    if (scaled < result.weight) {
      const wks = Math.round(daysSince / 7);
      return {
        ...result,
        weight: scaled,
        status: "return",
        note: `→ ${scaled}kg — ${wks} weeks since you last did this. Starting light on purpose; you'll be back past it inside a month.`
      };
    }
  }
  return result;
}

// ─── RESTART SEEDING ──────────────────────────────────────────────────────────
// A new program shouldn't throw away what the old one proved. When an exercise
// declares `seedFrom` (names it maps to in prior history), carry the load across
// — discounted for how long it's been, and adjusted for what the lift was doing
// when it stopped:
//   climbing  → it was working, stay close to it
//   stalled   → it was already too heavy, cut deeper
//   declining → almost always accumulated fatigue rather than lost strength
//               (the old algorithm deloaded end-of-session accessories for being
//               tired), so seed from the PEAK, not from the depressed last value
function computeRestartWeight(exercise, logs) {
  const names = exercise.seedFrom;
  if (!names || !names.length) return null;
  const eq = getEquipmentType(exercise.name);
  const minWeight = getBaseIncrement(eq); // plate weight — see calcNextWeight

  const mid = (range) => {
    const [a, b] = String(range || "").split("-").map(Number);
    return (Number.isFinite(a) && Number.isFinite(b)) ? (a + b) / 2 : null;
  };
  const targetMid = mid(exercise.repRange);

  // Every appearance of any seed name, newest first, as {ts, weight, repMid}.
  // repMid comes from whatever plan that session belonged to, so a lift that
  // moves between rep ranges can be compared honestly.
  const hits = [];
  for (const [, session] of Object.entries(logs).sort((a,b) => b[1].ts - a[1].ts)) {
    for (const n of names) {
      const sets = session.exercises?.[n];
      if (!sets?.length) continue;
      const ws = sets.filter(isScorable).map(s => num(s.weight));
      if (!ws.length) continue;
      const srcEx = lookupDay(session.day)?.exercises?.find(e => e.name === n);
      hits.push({ ts: session.ts, weight: Math.max(...ws), repMid: mid(srcEx?.repRange), name: n });
    }
  }
  if (!hits.length) return null;

  // "How long since you trained this movement" is a movement-level question —
  // answer it from every source before any filtering, so a variation you did
  // last week still counts as recent work.
  const days   = Math.max(0, Math.floor((Date.now() - hits[0].ts) / 86400000));
  const factor = stalenessFactor(days);

  // "What weight" is not movement-level. The same exercise NAME can mean two
  // different things across a program — the old plan ran Leg Curl at 6-10 on
  // power days and 10-15 on hypertrophy days, at wildly different loads.
  // Pooling those produces a fake trend ("climbing!") out of pure alternation,
  // so trend and peak are read only from the closest-matching rep range.
  if (targetMid && hits.some(h => h.repMid != null)) {
    const dist = h => (h.repMid == null ? Infinity : Math.abs(h.repMid - targetMid));
    const best = Math.min(...hits.map(dist));
    const filtered = hits.filter(h => dist(h) === best);
    if (filtered.length) { hits.length = 0; hits.push(...filtered); }
  }

  const last  = hits[0].weight;
  const peak  = Math.max(...hits.map(h => h.weight));

  // Trend over the last three appearances
  const recent = hits.slice(0, 3).map(h => h.weight);
  const climbing  = recent.length >= 2 && recent[0] > recent[recent.length - 1];
  const declining = recent.length >= 2 && recent[0] < recent[recent.length - 1];

  let base = last, trendAdj = 1, why = "";
  if (climbing)        { trendAdj = 1.00; why = "was climbing"; }
  else if (declining)  { base = peak; trendAdj = 0.90; why = `was drifting down (peak ${peak}kg)`; }
  else                 { trendAdj = 0.90; why = "had stalled"; }

  // Rep-range translation. A weight you hit for 4 reps is not a weight you hit
  // for 7 — carrying it across a range change unchanged guarantees a failed
  // first session. ~2.5% per rep, which is the usual rule of thumb, clamped so
  // an odd source range can't produce a wild number.
  const srcMid = hits[0].repMid;
  let rangeAdj = 1;
  if (srcMid && targetMid && srcMid !== targetMid) {
    rangeAdj = Math.min(1.1, Math.max(0.8, 1 - 0.025 * (targetMid - srcMid)));
  }

  const w = Math.max(minWeight, snap(base * factor * trendAdj * rangeAdj, eq));
  const wks = Math.round(days / 7);
  const when = wks <= 1 ? "last week" : `${wks}w ago`;
  const from = hits[0].name; // the lift actually drawn on, not just the first alias
  return {
    weight: w, status: "restart", increment: getBaseIncrement(eq), eq,
    note: from === exercise.name
      ? `→ ${w}kg — from your own numbers (${why}, ${when}). Starts light by design. Earn it back.`
      : `→ ${w}kg — carried over from ${from} (${why}, ${when}). Starts light by design. Earn it back.`
  };
}

// ─── REST TIMES ───────────────────────────────────────────────────────────────
// Defaults based on 2024 Schoenfeld et al. Bayesian meta-analysis on inter-set
// rest duration — sub-60s diminishes hypertrophy; 90–150s is the sweet spot.
// Power day compounds still get 3–5 min for ATP replenishment.
function getRestSeconds(exName, dayType) {
  // Between sets of the same exercise
  const heavy = ["Bench Press","OHP","Squat","Deadlift","Bent Over Row","Incline Barbell Press","Front Squat","Romanian Deadlift"];
  const med   = ["Incline DB Press","Flat DB Press","Seated Cable Row","One Arm DB Row","Lat Pulldown","Leg Press","Hip Thrust","Hack Squat / Leg Press"];
  if (heavy.includes(exName)) return dayType === "power" ? 240 : 150;
  if (med.includes(exName))   return dayType === "power" ? 180 : 120;
  return dayType === "power" ? 150 : 90; // isolations — still ≥ 90s for effective hypertrophy
}

// ─── WARM-UP RAMP ─────────────────────────────────────────────────────────────
// The app used to open an exercise by showing the working weight and a "Start
// set 1" button, with no acknowledgement that you don't walk up to a top set
// cold. These are shown as a checklist before the first working set — they are
// deliberately NOT logged, because warm-ups aren't performance data and feeding
// them to the progression tree would drag the working weight down.
function warmupSets(working, ex) {
  if (!(working > 0)) return [];
  const eq = getEquipmentType(ex.name);
  if (ex.barbell) {
    // IMPORTANT: barbell weights in this app are PLATE weight — the bar is not
    // included (see platesPerSide, and the "65kg plates" notes in PHUL). Warm-up
    // percentages have to be taken against the TRUE load (plates + bar) and then
    // converted back to plates for display, or the ramp is badly skewed: 55% of
    // 42.5 plates is 42.5kg on the bar, which is 68% of the real 62.5kg — a jump
    // straight from an empty bar to two-thirds of the working set.
    const bar = ex.barWeight || BAR.olympic;
    const total = working + bar;
    const out = [{ weight: 0, reps: 10, label: "bar" }]; // 0 plates = empty bar
    for (const [pct, reps] of [[0.5, 5], [0.7, 3], [0.87, 1]]) {
      const plates = Math.max(0, snap(total * pct - bar, eq));
      if (plates > out[out.length - 1].weight && plates < working) {
        out.push({ weight: plates, reps, label: `${Math.round(pct*100)}%` });
      }
    }
    return out;
  }
  // Machines / dumbbells — lighter ramp, two steps is plenty.
  const out = [];
  for (const [pct, reps] of [[0.5, 10], [0.75, 5]]) {
    const w = snap(working * pct, eq);
    if (w > 0 && w < working && (!out.length || w > out[out.length - 1].weight)) {
      out.push({ weight: w, reps, label: `${Math.round(pct*100)}%` });
    }
  }
  return out;
}

// ─── EFFORT TARGET ────────────────────────────────────────────────────────────
// How close to failure this specific exercise should be taken. A blanket rule
// is wrong in both directions, so it splits on tier:
//
//   tier 1-2 (compounds)  → stop ~2 reps short, RPE 8.
//     Strength gains actually favour staying further from failure; technique
//     degrades under a fatigued CNS on loaded spinal work; and failing set 1
//     costs reps on sets 2-3, which costs total volume — the thing that
//     actually drives growth. Observed directly: bench 8/5/4 = 17 reps, where
//     stopping set 1 at 6 would have given ~6/6/6 = 18.
//
//   tier 3 (isolations)   → last set to failure, freely.
//     Near-zero systemic cost, fast recovery, no technique to lose. This is
//     where an appetite for suffering belongs, and hard mode's myo-reps take
//     these past failure on purpose.
//
// Displayed in the session so the rule lives in the app rather than in someone's
// memory — the app previously showed a bare rep range, which reads as "get the
// top number" and quietly taught training every set to failure.
function effortTarget(ex) {
  return (ex?.tier || 3) <= 2
    ? { kind:"hold-back", rpeCap: 8, label: "Stop at RPE 8", detail: "leave 2 clean reps in the tank" }
    : { kind:"to-failure", rpeCap: 10, label: "Last set to failure", detail: "cheap to recover from — spend it here" };
}

// Colour for a suggestion note. "restart" and "return" are deliberately neutral
// info rather than red: coming back lighter after time off is the plan working,
// not the lifter failing, and it shouldn't be rendered as a warning.
function sugNoteClass(status) {
  if (status === "increase" || status === "crush" || status === "micro-up") return "ok";

function getBetweenExerciseRest(previousExName, dayType) {

  // plus a small buffer for walking to the next station and setting up.

// ─── PLATE CALCULATOR ─────────────────────────────────────────────────────────
// Computes plates per side given total plate weight (not including bar).
// Uses standard metric gym plate sizes, greedy allocation.
const PLATE_SET = [25, 20, 15, 10, 5, 2.5, 1.25];
function platesPerSide(totalPlateWeight) {
  const perSide = totalPlateWeight / 2;
  const breakdown = [];
  let remaining = perSide;
  for (const p of PLATE_SET) {
    const count = Math.floor(remaining / p + 1e-9); // float safety
    if (count > 0) {
      breakdown.push({ plate: p, count });
      remaining -= count * p;
      remaining = Math.round(remaining * 100) / 100;
    }
  }
  return { perSide, breakdown, leftover: remaining > 0.01 ? remaining : 0 };
}
function formatPlateBreakdown(totalPlateWeight) {
  if (totalPlateWeight <= 0) return "bar only";
  const { breakdown, leftover } = platesPerSide(totalPlateWeight);
  if (!breakdown.length) return "bar only";
  const parts = breakdown.map(b => `${b.count}×${b.plate}`);
  return parts.join(" + ") + (leftover > 0 ? ` + ${leftover}kg ?` : "");
}

const BULK_KCAL = 2900, CUT_KCAL = 2200, PROTEIN_G = 155;

// ─── CALORIE / PROTEIN TARGETS ────────────────────────────────────────────────
// Derived from body composition and ACTUAL training frequency, not hardcoded.
// Two numbers are returned rather than one, deliberately:
//   floor  — the intake below which the phase stops working (on a bulk that's
//            maintenance: eat less and you lose lean mass, which is exactly what
//            happened over Mar–Apr 2026 while the app displayed "bulk")
//   target — where you actually want to land
// A single target you miss most days just renders a failure notice every day.
// A floor is passable, which makes it worth aiming at.
function computeTargets(stats, workoutLogs, phase) {
  const latest = (stats && stats[stats.length - 1]) || INIT_STATS;
  const weight = num(latest.weight) > 0 ? num(latest.weight) : 72;
  const height = num(latest.height) > 0 ? num(latest.height) : 180;
  const bf     = num(latest.bodyFat);
  // Prefer a measured lean mass; else derive it from body fat %; else nothing.
  const lean = num(latest.leanMass) > 0 ? num(latest.leanMass)
             : num(latest.muscleMass) > 0 ? num(latest.muscleMass)
             : (bf > 0 && bf < 60) ? weight * (1 - bf / 100)
             : null;
  // Katch-McArdle where lean mass is known — materially more accurate than
  // bodyweight formulas for lean lifters. Mifflin-St Jeor otherwise.
  const bmr = lean ? 370 + 21.6 * lean
                   : 10 * weight + 6.25 * height - 5 * 25 + 5;

  // Activity: a base multiplier for ordinary daily life, PLUS the measured cost
  // of sessions actually logged over the last 8 weeks. Deliberately not a tier
  // ladder keyed on training frequency — that makes the multiplier collapse
  // toward sedentary during a bad stretch, which quietly lowers the calorie
  // target exactly when someone is already under-eating, and makes the lowered
  // target easier to "hit". Non-training life doesn't stop when the gym does.
  const BASE_ACTIVITY = 1.30;   // daily living, non-training
  const KCAL_PER_SESSION = 350; // ~55 min of lifting including EPOC
  const since = Date.now() - 56 * 86400000;
  const perWk = Object.values(workoutLogs || {}).filter(s => s.ts >= since).length / 8;

  const r10 = n => Math.round(n / 10) * 10;
  const maintenance = r10(bmr * BASE_ACTIVITY + perWk * KCAL_PER_SESSION / 7);
  const activity = Math.round((maintenance / bmr) * 100) / 100; // effective, for display
  // ~+400 is the lean-bulk surplus that yields 0.25–0.5 kg/month for an
  // intermediate. Faster is mostly fat.
  const target = r10(phase === "bulk" ? maintenance + 400 : maintenance - 400);
  const floor  = phase === "bulk" ? maintenance : r10(maintenance - 650);
  return {
    bmr: Math.round(bmr), lean: lean ? Math.round(lean * 10) / 10 : null,
    weight, perWk: Math.round(perWk * 10) / 10, activity, maintenance,
    target, floor,
    proteinMin: Math.round(weight * 1.6),   // established lower bound
    protein:    Math.round(weight * 2.0),   // upper end of the useful range
    hasStats: !!lean,
  };
}

// ─── CONSISTENCY ──────────────────────────────────────────────────────────────
// Sessions per rolling week, oldest → newest. A "week" is a 7-day bucket counting
// back from now, not a calendar week — a Sunday session and the following
// Saturday one shouldn't land in different buckets because a calendar boundary
// happened to fall between them. `streak` counts consecutive buckets containing
// at least one session, which is the only training metric here that has ever
// predicted anything for this user.
function consistency(workoutLogs) {
  const dots = new Array(8).fill(0);
  let last30 = 0;
  for (const s of Object.values(workoutLogs || {})) {
    const age = Date.now() - s.ts;
    const wk = Math.floor(age / (7 * 86400000));
    if (wk >= 0 && wk < 8) dots[wk]++;
    if (age < 30 * 86400000) last30++;
  }
  dots.reverse();
  let streak = 0;
  for (let i = dots.length - 1; i >= 0; i--) {
    if (dots[i] > 0) streak++; else break;
  }
  return { dots, streak, last30 };
}

// ─── INTENSITY PHASING ────────────────────────────────────────────────────────
// Hard mode is earned, not chosen. Every previous restart failed the same way:
// come back, go hard immediately, disappear within a month. So the first three
// weeks run deliberately submaximal and the intensity work unlocks only once
// three consecutive weeks have actually been logged. The gate IS the point — the
// skill trained in weeks 1–3 is showing up when it isn't exciting, which is the
// one this user's data says is missing. Effort was never missing: 53% of his
// logged sets were RPE 9–10.
//
// Technique selection is deliberately narrow. Volume-controlled trials show
// intensity techniques produce the SAME hypertrophy as straight sets, just in
// less time — so they're included where they buy density (myo-reps) or drive
// progression (AMRAP), and excluded where they only add fatigue. Past-failure
// lengthened partials are the notable omission: matched for total reps they
// grow no more than additional full-ROM sets, and they cost extra recovery.
const HARD_MODE_WEEKS = 3;
const FINISHERS = {
  amrap: {
    label: "AMRAP",
    cue: "Last set: max clean reps at this weight. Stop at RPE 9 — one good rep still in the tank, not zero.",
  },
  myo: {
    label: "Myo-reps",
    cue: "Take it to RPE 9. Then rest 15s → 3–5 reps, ×3 rounds. Log the total reps. Run this one on its own, not in the superset.",
  },
};
function hardModeState(workoutLogs) {
  const streak = consistency(workoutLogs).streak;
  return { on: streak >= HARD_MODE_WEEKS, streak, need: HARD_MODE_WEEKS };
}
// Applies the per-exercise `hardMode` overrides. Returns the plan untouched when
// hard mode is off, so the normal path is completely unaffected.
function applyIntensity(plan, on) {
  if (!plan?.exercises || !on) return plan;
  return {
    ...plan,
    intense: true,
    exercises: plan.exercises.map(e => e.hardMode
      ? { ...e, sets: e.hardMode.sets ?? e.sets, finish: e.hardMode.finish || null }
      : e),
  };
}

// Days since the most recent body measurement, or null if there are none.
function daysSinceWeighIn(stats) {
  const last = stats && stats[stats.length - 1];
  if (!last?.date) return null;
  const t = new Date(last.date + "T12:00:00").getTime();
  return Number.isFinite(t) ? Math.max(0, Math.floor((Date.now() - t) / 86400000)) : null;
}

// ─── BODY TREND ALARM ─────────────────────────────────────────────────────────
// The app had every number needed to catch a 1kg lean-mass loss during a "bulk"

// prompt didn't exist. This returns a dashboard-level verdict instead.
function bodyTrendAlarm(stats, phase, targets) {
  const stale = daysSinceWeighIn(stats);
  if (stale === null) return { level: "none", stale };
  if (!stats || stats.length < 2) return { level: stale > 14 ? "measure" : "none", stale };

  const a = stats[0], b = stats[stats.length - 1];
  const wDelta = num(b.weight) - num(a.weight);
  const leanOf = s => num(s.leanMass) > 0 ? num(s.leanMass) : num(s.muscleMass);
  const lDelta = (Number.isFinite(leanOf(a)) && Number.isFinite(leanOf(b)))
    ? leanOf(b) - leanOf(a) : null;

  // Losing lean mass is the one outcome worth interrupting someone over,
  // regardless of phase — it means the training is being undone by the eating.
  if (lDelta !== null && lDelta <= -0.5) {
    return { level: "bad", stale, wDelta, lDelta,
      headline: `Lean mass down ${Math.abs(lDelta).toFixed(1)}kg`,
      body: phase === "bulk"
        ? `You're set to bulk but eating below maintenance (~${targets.floor} kcal). That's training hard and going backwards — add roughly ${Math.max(200, targets.target - Math.round(targets.maintenance * 0.88))} kcal a day.`
        : `A cut costs some lean mass, but this is more than it should. Raise intake toward ${targets.maintenance} kcal and keep protein at ${targets.proteinMin}g+.` };
  }
  if (phase === "bulk" && wDelta <= -0.5) {
    return { level: "warn", stale, wDelta, lDelta,
      headline: `Weight down ${Math.abs(wDelta).toFixed(1)}kg on a bulk`,
      body: `You're eating under maintenance (~${targets.maintenance} kcal). Nothing will grow until that flips.` };
  }
  if (phase === "cut" && wDelta >= 0.5) {
    return { level: "warn", stale, wDelta, lDelta,
      headline: `Weight up ${wDelta.toFixed(1)}kg on a cut`,
      body: `Intake is above maintenance (~${targets.maintenance} kcal).` };
  }
  if (stale > 14) return { level: "measure", stale, wDelta, lDelta };
  return { level: "ok", stale, wDelta, lDelta };
}

// Derive "volume last time" + "vs 5-session avg" for the next-session card.
// Volume = sum of weight*reps across all sets of same day. Returns null if
// insufficient history (< 2 completed sessions of that day type).
function sessionVolume(log) {
  let t = 0;
  for (const sets of Object.values(log.exercises || {})) {
    for (const s of sets) {
      const w = parseFloat(s.weight), r = parseFloat(s.reps);
      if (s.done && !isNaN(w) && !isNaN(r)) t += w * r;
    }
  }
  return t;
}
// Pending makeups — derived from logs each render, no new state. For each
// PHUL session's `abandoned` list, the exercise stays "pending" until any
// subsequent same-day-type session records a completed set of it. Ignored if
// older than `windowDays` (default 14). Returns array grouped by dayType.
function computePendingMakeups(workoutLogs, dismissedMakeups = [], windowDays = 14) {
  const cutoff = Date.now() - windowDays * 86400000;
  const dismissedSet = new Set(dismissedMakeups);
  const allLogs = Object.entries(workoutLogs)
    .filter(([, log]) => lookupDay(log.day))
    .sort((a, b) => a[1].ts - b[1].ts);

  const pendingByDay = {}; // dayType → [{ exName, sourceLogKey, sourceDate, abandonedAt }]

  for (const [key, log] of allLogs) {
    const dayType = log.day;
    pendingByDay[dayType] = pendingByDay[dayType] || [];

    // Resolve: any exercise this session completed gets removed from pending
    if (log.exercises) {
      pendingByDay[dayType] = pendingByDay[dayType].filter(p => {
        const doneCount = log.exercises[p.exName]?.filter(s => s.done).length || 0;
        return doneCount === 0;
      });
    }

    // Add new pending from this session's abandoned list — skipping anything
    // the user manually marked done from the Catch Up card.
    if (log.abandoned?.length) {
      for (const exName of log.abandoned) {
        if (dismissedSet.has(`${key}::${exName}`)) continue;
        if (pendingByDay[dayType].some(p => p.exName === exName)) continue;
        pendingByDay[dayType].push({
          exName,
          sourceLogKey: key,
          sourceDate: log.date,
          abandonedAt: log.ts,
        });
      }
    }
  }

  // Flatten + apply time window
  const groups = [];
  for (const [dayType, items] of Object.entries(pendingByDay)) {
    const fresh = items.filter(i => i.abandonedAt >= cutoff);
    if (fresh.length) groups.push({ dayType, items: fresh });
  }
  // Sort groups by most recent abandonedAt
  groups.sort((a, b) => {
    const aMax = Math.max(...a.items.map(i => i.abandonedAt));
    const bMax = Math.max(...b.items.map(i => i.abandonedAt));
    return bMax - aMax;
  });
  return groups;
}

function mesocycleDelta(workoutLogs, dayType) {
  const same = Object.values(workoutLogs)
    .filter(l => l.day === dayType)
    .sort((a,b) => b.ts - a.ts)
    .slice(0, 6); // last + 5 prior
  if (same.length < 2) return null;
  const last = sessionVolume(same[0]);
  const prior = same.slice(1).map(sessionVolume).filter(v => v > 0);
  if (!prior.length) return null;
  const avg = prior.reduce((a,b)=>a+b,0) / prior.length;
  if (avg === 0) return null;
  const deltaPct = ((last - avg) / avg) * 100;
  return { last, avg, deltaPct };
}
function Dashboard({ latest, phase, kcalTarget, todayDiet, workoutLogs, setTab, setActiveSession, startSession, draftSession, pendingMakeups = [], startMakeup, dismissMakeup, program, targets, trend, hardMode }) {

      <div className="next-card">

      {/* Body-trend alarm, mirrored onto the dashboard — a lean-mass loss during

      {prLifts.length > 0 && (
        <div className="card">
          <div className="section-head">

            {prLifts.map((p, i) => (
              <div key={i} className="pr-row is-pr">

      {recent.length > 0 && (
        <div className="card">
          <div className="section-head">
            <span className="eyebrow">Recent sessions</span>

            const pillLabel = t === "power" ? "PWR" : t === "hypertrophy" ? "HYP" : t === "fullbody" ? "FULL" : "CUS";
            const displayName = s.dayLabel || p?.name || s.day;
            return (
