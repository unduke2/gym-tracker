                          </div>
                          <div style={{display:"grid", gridTemplateColumns:"auto 1fr 1fr", gap:10}}>
                            <button className="btn danger" style={{padding:"10px 12px"}} onClick={() => {
                              if (confirm(`Delete "${m.name}" from the library?`)) deleteMeal(m.id);
                            }}>Delete</button>
                            <button className="btn ghost" onClick={cancelEditMeal}>Cancel</button>
                            <button className="btn accent" onClick={saveEditMeal}>Save</button>
                          </div>
                        </div>
                      );
                    }
                    return (
                      <div key={m.id} className={`meal-lib-item${m.fav?" fav":""}`}>
                        <div className="meal-lib-top">
                          <div style={{flex:1, minWidth:0}}>
                            <div className="meal-lib-name">{m.name}</div>
                            <div className="meal-lib-desc">{m.desc}</div>
                            {m.tip && <div className="meal-lib-tip">💡 {m.tip}</div>}
                          </div>
                          <div className="meal-lib-actions">
                            <button className="meal-lib-add" onClick={() => { addMealToday(m); setView("today"); }}>+ add</button>
                            <div className="meal-lib-mini-row">
                              <button
                                className={`meal-lib-mini star${m.fav?" on":""}`}
                                onClick={() => toggleFavMeal(m.id)}
                                title={m.fav ? "Unfavorite" : "Favorite"}
                              >{m.fav ? "★" : "☆"}</button>
                              <button
                                className="meal-lib-mini"
                                onClick={() => startEditMeal(m)}
                                title="Edit meal"
                              >Edit</button>
                            </div>
                          </div>
                        </div>
                        <div className="meal-lib-meta">
                          <span className="k">{getMealKcal(m,phase)} kcal</span>
                          <span className="p">{m.baseProt}g prot</span>
                          {m.carbHeavy && <span className="tag">{phase==="bulk"?"↑ bulk carbs":"↓ cut carbs"}</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })}

            {!showAddMeal ? (
              <button className="add-meal-open" onClick={() => setShowAddMeal(true)}>+ Add new meal to library</button>
            ) : (
              <div className="add-meal-form">
                <div className="eyebrow" style={{marginBottom:12}}>New meal</div>
                {[
                  { label:"Name",         key:"name", ph:"Chicken + quinoa" },
                  { label:"Description",  key:"desc", ph:"Ingredients + quantities" },
                  { label:"Tip (optional)", key:"tip", ph:"Context / pairing" },
                ].map(f => (
                  <div key={f.key} style={{marginBottom:10}}>
                    <label>{f.label}</label>
                    <input value={newMeal[f.key]} onChange={e => setNewMeal(p=>({...p,[f.key]:e.target.value}))} placeholder={f.ph} type="text"/>
                  </div>
                ))}
                <div className="amf-row">
                  <div>
                    <label>Kcal</label>
                    <input value={newMeal.baseKcal} onChange={e => setNewMeal(p=>({...p,baseKcal:e.target.value}))} placeholder="500" type="text" inputMode="decimal" style={{textAlign:"center"}}/>
                  </div>
                  <div>
                    <label>Prot g</label>
                    <input value={newMeal.baseProt} onChange={e => setNewMeal(p=>({...p,baseProt:e.target.value}))} placeholder="40" type="text" inputMode="decimal" style={{textAlign:"center"}}/>
                  </div>
                  <div>
                    <label>Category</label>
                    <select value={newMeal.cat} onChange={e => setNewMeal(p=>({...p,cat:e.target.value}))}>
                      {CAT_ORDER.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                </div>
                <div className="amf-check">
                  <input type="checkbox" checked={newMeal.carbHeavy} onChange={e => setNewMeal(p=>({...p,carbHeavy:e.target.checked}))} id="carbHeavy"/>
                  <label htmlFor="carbHeavy" style={{marginBottom:0}}>Carb-heavy (scales portions per phase)</label>
                </div>
                <div className="btn-row">
                  <button className="btn ghost" onClick={() => { setShowAddMeal(false); setNewMeal({ name:"", cat:"snack", desc:"", baseKcal:"", baseProt:"", carbHeavy:false, tip:"" }); }}>Cancel</button>
                  <button className="btn accent" onClick={() => {
                    if (!newMeal.name || !newMeal.baseKcal || !newMeal.baseProt) return;
                    const m = { ...newMeal, id:"m"+Date.now(), baseKcal:parseNum(newMeal.baseKcal), baseProt:parseNum(newMeal.baseProt) };
                    setMeals(prev => [...prev, m]);
                    setNewMeal({ name:"", cat:"snack", desc:"", baseKcal:"", baseProt:"", carbHeavy:false, tip:"" });
                    setShowAddMeal(false);
                  }}>Save meal</button>
                </div>
              </div>
            )}
          </div>
        </>
      )}

      {view==="history" && (
        <div className="card">
          <div className="section-head">
            <span className="eyebrow">History</span>
          </div>
          {Object.keys(dietLogs).length === 0 && <div style={{color:"var(--ink-4)", fontSize:13}}>No diet history yet.</div>}
          {Object.entries(dietLogs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30).map(([date,d]) => {
            const hitBoth = d.kcal>=kcalTarget && d.protein>=PROTEIN_G;
            const hitProt = d.protein>=PROTEIN_G;
            const dotCls  = hitBoth ? "ok" : hitProt ? "half" : "bad";
            return (
              <div key={date} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderTop:"1px solid var(--line)"}}>
                <div style={{display:"flex", alignItems:"center", gap:10}}>
                  <i className={`sw ${dotCls}`} style={{display:"inline-block", width:8, height:8, borderRadius:"50%", background: dotCls==="ok"?"var(--ok)":dotCls==="half"?"var(--warn)":"var(--bad)"}}/>
                  <div>
                    <div style={{fontFamily:"var(--font-mono)", fontSize:12, color:"var(--ink-2)", letterSpacing:"0.04em"}}>{date}</div>
                    <div style={{display:"flex", gap:14, marginTop:3, fontFamily:"var(--font-mono)", fontSize:11, letterSpacing:"0.04em"}}>
                      <span style={{color: d.kcal>=kcalTarget?"var(--ok)":"var(--ink-3)"}}>{d.kcal} kcal</span>
                      <span style={{color: d.protein>=PROTEIN_G?"var(--ok)":"var(--ink-3)"}}>{d.protein}g prot</span>
                    </div>
                  </div>
                </div>
                {confirmDelDiet===date ? (
                  <div className="del-confirm">
                    <button onClick={() => setConfirmDelDiet(null)}>no</button>
                    <button className="danger" onClick={() => { setDietLogs(prev => { const n={...prev}; delete n[date]; return n; }); setConfirmDelDiet(null); }}>delete</button>
                  </div>
                ) : (
                  <div style={{display:"flex", gap:6}}>
                    <button
                      className="del-btn"
                      onClick={() => { setEditDate(date); setView("today"); }}
                      style={{color:"var(--accent)", borderColor:"color-mix(in oklab, var(--accent) 40%, var(--line-2))"}}
                      aria-label="Edit this day"
                    >✎</button>
                    <button className="del-btn" onClick={() => setConfirmDelDiet(date)}>⌫</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </>
  );
}

// ─── BODY ANALYSIS ENGINE ────────────────────────────────────────────────────
// Thresholds calibrated for 23yo male, bulk/cut cycle
const BF_BULK_STOP  = 18;   // stop bulk, start cut
const BF_CUT_TARGET = 12;   // summer target
const BF_IDEAL_BULK = 14;   // ideal bulk start point
const WEIGHT_NOISE  = 0.5;  // kg — within this = "stable"
const BF_NOISE      = 0.4;  // % — within this = "stable"

function analyseProgress(stats, phase) {
  if (stats.length < 2) return null;
  const latest = stats[stats.length - 1];
  const prev   = stats[stats.length - 2];

  const wDelta  = latest.weight  - prev.weight;
  const bfDelta = latest.bodyFat - prev.bodyFat;

  // Derived fat mass change in kg
  const fatKgNow  = latest.weight * (latest.bodyFat / 100);
  const fatKgPrev = prev.weight   * (prev.bodyFat   / 100);
  const fatKgDelta = fatKgNow - fatKgPrev;

  // Lean mass change
  const leanNow  = latest.weight - fatKgNow;
  const leanPrev = prev.weight   - fatKgPrev;
  const leanDelta = leanNow - leanPrev;

  const wUp   = wDelta  >  WEIGHT_NOISE;
  const wDown = wDelta  < -WEIGHT_NOISE;
  const wFlat = !wUp && !wDown;
  const bfUp  = bfDelta >  BF_NOISE;
  const bfDn  = bfDelta < -BF_NOISE;
  const bfFlt = !bfUp && !bfDn;

  let scenario, emoji, color, advice;

  if (phase === "bulk") {
    if (wUp && bfFlt)       { scenario = "Clean bulk"; emoji = "✅"; color = "#00e87a"; advice = "Weight up, body fat stable. You're building muscle cleanly. Keep it up."; }
    else if (wUp && bfDn)   { scenario = "Exceptional bulk"; emoji = "🔥"; color = "#00e87a"; advice = "Weight up AND body fat dropping. You're gaining muscle faster than fat. Rare — keep doing exactly what you're doing."; }
    else if (wUp && bfUp)   { scenario = "Dirty bulk"; emoji = "⚠️"; color = "#ffc94d"; advice = `Weight and body fat both rising. You're gaining too much fat. Consider dropping ~200 kcal/day or cleaning up food quality.${latest.bodyFat >= BF_BULK_STOP ? " You're at " + latest.bodyFat + "% — time to consider switching to cut." : ""}`; }
    else if (wFlat && bfDn) { scenario = "Recomposition"; emoji = "🔥"; color = "#00e87a"; advice = "Weight stable but body fat dropping — you're losing fat while gaining muscle simultaneously. This is ideal for your level."; }
    else if (wFlat && bfFlt){ scenario = "Stalled"; emoji = "⏸"; color = "#ffc94d"; advice = "Nothing is changing. You're likely at maintenance. Increase calories by 150-200 kcal/day to restart the bulk."; }
    else if (wDown && bfFlt){ scenario = "Losing muscle"; emoji = "🚨"; color = "#ff4d1c"; advice = "Weight dropping but body fat staying the same — you're losing lean mass. Increase calories and check protein intake (target 155g/day)."; }
    else if (wDown && bfDn) { scenario = "Cutting in bulk phase"; emoji = "⚠️"; color = "#ffc94d"; advice = "You're losing both fat and weight — you're in a deficit during your bulk. Eat more."; }
    else                    { scenario = "Mixed signals"; emoji = "🔍"; color = "#7888a0"; advice = "Changes are within noise range. Log another measurement in a week to see a clearer trend."; }
  } else {
    // cut phase
    if (wDown && bfDn)      { scenario = "Clean cut"; emoji = "✅"; color = "#00e87a"; advice = `Losing weight and body fat together — textbook cut. Muscle is being preserved. ${latest.bodyFat <= BF_CUT_TARGET ? "You're approaching your summer target of " + BF_CUT_TARGET + "%! 🎯" : "Keep going."}`; }
    else if (wDown && bfFlt){ scenario = "Losing muscle"; emoji = "🚨"; color = "#ff4d1c"; advice = "Weight dropping but body fat not moving — you're losing lean mass, not fat. Deficit is too aggressive or protein too low. Reduce deficit and up protein."; }
    else if (wDown && bfUp) { scenario = "Muscle loss"; emoji = "🚨"; color = "#ff4d1c"; advice = "Weight down and body fat % rising — you're losing muscle faster than fat. Serious red flag. Cut the deficit and prioritise protein."; }
    else if (wFlat && bfDn) { scenario = "Recomposition"; emoji = "🔥"; color = "#00e87a"; advice = "Weight stable, body fat dropping — gaining muscle while losing fat. Best case scenario during a cut."; }
    else if (wFlat && bfFlt){ scenario = "Stalled"; emoji = "⏸"; color = "#ffc94d"; advice = "No change. Either your deficit is too small or your body has adapted. Try reducing calories by 100-150 kcal or adding a short walk after meals."; }
    else if (wUp && bfDn)   { scenario = "Muscle gain dominant"; emoji = "✅"; color = "#00e87a"; advice = "Weight slightly up but body fat dropping — you're building muscle faster than expected during a cut. Keep it up."; }
    else                    { scenario = "Mixed signals"; emoji = "🔍"; color = "#7888a0"; advice = "Changes within noise range. Measure again in a week for a clearer picture."; }
  }

  // Phase-specific warnings
  let warning = null;
  if (phase === "bulk" && latest.bodyFat >= BF_BULK_STOP) {
    warning = { text: `Body fat at ${latest.bodyFat}% — above the ${BF_BULK_STOP}% bulk stop point. Consider switching to cut.`, color: "#ff4d1c" };
  } else if (phase === "cut" && latest.bodyFat <= BF_CUT_TARGET) {
    warning = { text: `Body fat at ${latest.bodyFat}% — you've hit your ${BF_CUT_TARGET}% summer target! 🎯`, color: "#00e87a" };
  }

  return { scenario, emoji, color, advice, warning, wDelta, bfDelta, fatKgDelta: fatKgDelta.toFixed(1), leanDelta: leanDelta.toFixed(1) };
}

// ─── STATS TAB ────────────────────────────────────────────────────────────────
function StatsTab({ stats, setStats, phase, theme, setTheme }) {
  const [form, setForm] = useState({ weight:"", bodyFat:"" });
  const [saved, setSaved] = useState(false);
  const latest = stats[stats.length-1] || INIT_STATS;
  const first  = stats[0] || INIT_STATS;
  const analysis = analyseProgress(stats, phase);

  const addEntry = () => {
    const w  = parseNum(form.weight);
    const bf = parseNum(form.bodyFat);
    // Real numeric range guard — parseNum coerces garbage to 0, which would
    // otherwise store a bogus 0kg/0% entry and fire a false "losing muscle" alert.
    if (!(w >= 30 && w <= 300) || !(bf >= 3 && bf <= 60)) return;
    const e = {
      date: todayStr(),
      weight: w,
      bodyFat: bf,
      leanMass: parseFloat((w * (1 - bf/100)).toFixed(1)),
      height: latest.height,
      bmr: latest.bmr,
    };
    setStats(prev => [...prev, e]);
    setForm({ weight:"", bodyFat:"" });
    setSaved(true); setTimeout(() => setSaved(false), 2000);
  };

  const wDelta  = latest.weight  - first.weight;
  const bfDelta = latest.bodyFat - first.bodyFat;
  const leanNow   = latest.weight * (1 - latest.bodyFat/100);
  const leanFirst = first.weight  * (1 - first.bodyFat/100);
  const leanDelta = leanNow - leanFirst;

  // Trend chart data (all history)
  const hist = stats.map(s => ({
    w: s.weight,
    bf: s.bodyFat,
    lean: s.weight * (1 - s.bodyFat/100),
  }));
  const wVals = hist.map(h => h.w);
  const spark = (vals, W = 320, H = 110, pad = 6) => {
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const r = mx - mn || 1;
    const pts = vals.map((v, i) => {
      const x = vals.length === 1 ? W/2 : (i / (vals.length - 1)) * W;
      const y = pad + (H - pad * 2) - ((v - mn) / r) * (H - pad * 2);
      return [x, y];
    });
    const path = pts.map((p, i) => `${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    const area = pts.length > 1 ? `${path} L${W},${H} L0,${H} Z` : "";
    return { path, area, last: pts[pts.length - 1] };
  };
  const wChart = wVals.length >= 2 ? spark(wVals, 320, 110, 6) : null;

  const bfCls = latest.bodyFat < BF_CUT_TARGET ? "bf-ok" : latest.bodyFat < BF_BULK_STOP ? "bf-warn" : "bf-bad";
  const bfMarkerPct = Math.min(98, Math.max(2, (latest.bodyFat/25)*100));
  const bfOkLeft   = Math.min(100, Math.max(0, (BF_CUT_TARGET/25)*100));
  const bfOkWidth  = ((BF_BULK_STOP-BF_CUT_TARGET)/25)*100;

  // Scenario tone mapping
  const toneCls = analysis?.color === "#00e87a" ? "good"
               : analysis?.color === "#ff4d1c" ? "bad"
               : analysis?.color === "#ffc94d" ? "warn" : "neutral";

  // Composition split
  const fatKg = latest.weight * (latest.bodyFat/100);
  const leanPct = 100 - latest.bodyFat;

  // Metric chips with sparklines
  const mkDelta = (v, unit, inverted = false) => {
    if (Math.abs(v) < 0.05) return { cls: "flat", txt: `0${unit}` };
    const up = v > 0;
    const good = inverted ? !up : up;
    return { cls: good ? "down" : "up", sign: up?"↑":"↘", txt: `${up?"+":""}${v.toFixed(1)}${unit}` };
  };
  const dW    = mkDelta(wDelta, "kg");
  const dBF   = mkDelta(bfDelta, "%", true);
  const dLean = mkDelta(leanDelta, "kg");

  return (
    <>
      {/* Hero — body weight + trend chart */}
      <div className="card">
        <div className="section-head">
          <span className="eyebrow">Body weight</span>
          <span className="eyebrow" style={{color:"var(--ink-4)"}}>{latest.date}</span>
        </div>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:12}}>
          <div className="tnum" style={{fontSize:44, fontWeight:800, letterSpacing:"-0.03em", lineHeight:1}}>
            {latest.weight}<span className="unit">kg</span>
          </div>
          {hist.length >= 2 && (
            <div style={{textAlign:"right"}}>
              <div style={{display:"inline-flex", gap:4, padding:"4px 10px", borderRadius:999, background:`color-mix(in oklab, var(--${wDelta<0?"ok":wDelta>0?"bad":"ink-3"}) 16%, transparent)`, color:`var(--${wDelta<0?"ok":wDelta>0?"bad":"ink-3"})`, fontFamily:"var(--font-mono)", fontSize:11, fontWeight:800, letterSpacing:"0.04em"}}>
                <span style={{fontSize:13}}>{wDelta<0?"↘":wDelta>0?"↑":"—"}</span>
                <span className="tnum">{Math.abs(wDelta).toFixed(1)}kg</span>
              </div>
              <div style={{fontFamily:"var(--font-mono)", fontSize:10, color:"var(--ink-3)", letterSpacing:"0.12em", marginTop:4, textTransform:"uppercase"}}>
                since baseline
              </div>
            </div>
          )}
        </div>
        {wChart && (
          <div style={{height:120, margin:"0 -4px"}}>
            <svg viewBox="0 0 320 110" preserveAspectRatio="none" style={{width:"100%", height:"100%"}}>
              <defs>
                <linearGradient id="bodyFill" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0" stopColor="var(--accent)" stopOpacity="0.22"/>
                  <stop offset="1" stopColor="var(--accent)" stopOpacity="0"/>
                </linearGradient>
              </defs>
              <path d={wChart.area} fill="url(#bodyFill)"/>
              <path d={wChart.path} fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
              {wChart.last && (
                <>
                  <circle cx={wChart.last[0]} cy={wChart.last[1]} r="4.5" fill="var(--accent)"/>
                  <circle cx={wChart.last[0]} cy={wChart.last[1]} r="1.8" fill="var(--bg)"/>
                </>
              )}
            </svg>
          </div>
        )}
      </div>

      {/* Current stats grid */}
      <div className="stats-current">
        <div className="section-head">
          <span className="eyebrow">Current</span>
          <span className="eyebrow" style={{color:"var(--ink-4)"}}>{stats.length} entries</span>
        </div>
        <div className="stats-grid">
          <div className="stat">
            <div className="sk">Weight</div>
            <div className="sv tnum">{latest.weight}<span className="u">kg</span></div>
          </div>
          <div className="stat">
            <div className="sk">Body fat</div>
            <div className={`sv tnum ${bfCls}`}>{latest.bodyFat}<span className="u">%</span></div>
          </div>
          <div className="stat">
            <div className="sk">Lean</div>
            <div className="sv tnum lean">{leanNow.toFixed(1)}<span className="u">kg</span></div>
          </div>
        </div>
        <div className="bf-range">
          <div className="bf-range-labels">
            <span>cut target {BF_CUT_TARGET}%</span>
            <span>bulk stop {BF_BULK_STOP}%</span>
          </div>
          <div className="bf-range-track">
            <div className="bf-range-ok" style={{left:`${bfOkLeft}%`, width:`${bfOkWidth}%`}}/>
            <div className="bf-range-marker" style={{left:`${bfMarkerPct}%`}}/>
          </div>
          <div className="bf-range-scale">
            <span>lean</span><span>healthy</span><span>high</span>
          </div>
        </div>
      </div>

      {/* Scenario analysis card */}
      {analysis && (
        <div className={`scenario-card tone-${toneCls}`}>
          <div className="scenario-head">
            <div className="scenario-mark">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                {toneCls === "good" && <path d="M20 6L9 17l-5-5"/>}
                {toneCls === "warn" && <><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></>}
                {toneCls === "bad"  && <><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></>}
                {toneCls === "neutral" && <><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></>}
              </svg>
            </div>
            <div className="scenario-title">
              {analysis.scenario}
              <span className="scenario-phase">· {phase.toUpperCase()} phase</span>
            </div>
          </div>
          <div className="scenario-msg">{analysis.advice}</div>
          <div className="scenario-deltas">
            <div className="scenario-delta">
              <div className="dk">Weight</div>
              <div className={`dv tnum ${analysis.wDelta>0?"bad":analysis.wDelta<0?"info":""}`}>
                {analysis.wDelta>0?"+":""}{analysis.wDelta.toFixed(1)}kg
              </div>
            </div>
            <div className="scenario-delta">
              <div className="dk">Fat %</div>
              <div className={`dv tnum ${analysis.bfDelta>0?"bad":analysis.bfDelta<0?"ok":""}`}>
                {analysis.bfDelta>0?"+":""}{analysis.bfDelta.toFixed(1)}%
              </div>
            </div>
            <div className="scenario-delta">
              <div className="dk">Fat kg</div>
              <div className={`dv tnum ${Number(analysis.fatKgDelta)>0?"bad":Number(analysis.fatKgDelta)<0?"ok":""}`}>
                {analysis.fatKgDelta>0?"+":""}{analysis.fatKgDelta}kg
              </div>
            </div>
            <div className="scenario-delta">
              <div className="dk">Lean</div>
              <div className={`dv tnum ${Number(analysis.leanDelta)>0?"ok":Number(analysis.leanDelta)<0?"bad":""}`}>
                {analysis.leanDelta>0?"+":""}{analysis.leanDelta}kg
              </div>
            </div>
          </div>
          {analysis.warning && (
            <div className={`scenario-warn ${analysis.warning.color==="#00e87a"?"ok":analysis.warning.color==="#ff4d1c"?"bad":""}`}>
              ⚡ {analysis.warning.text}
            </div>
          )}
        </div>
      )}

      {/* Composition split */}
      <div className="card">
        <div className="section-head">
          <span className="eyebrow">Composition</span>
          <span className="eyebrow" style={{color:"var(--ink-4)"}}>{latest.weight} kg total</span>
        </div>
        <div className="comp-labels">
          <span><span className="lean-k">Lean</span> <span className="tnum">{leanNow.toFixed(1)}</span><span className="u">kg</span></span>
          <span><span className="fat-k">Fat</span> <span className="tnum">{fatKg.toFixed(1)}</span><span className="u">kg</span></span>
        </div>
        <div className="comp-bar">
          <div className="comp-lean" style={{flexBasis:`${leanPct}%`}}/>
          <div className="comp-fat"  style={{flexBasis:`${latest.bodyFat}%`}}/>
        </div>
        <div className="comp-pct">
          <span>{leanPct.toFixed(1)}% lean</span>
          <span>{latest.bodyFat}% body fat</span>
        </div>
      </div>

      {/* Metric chips with sparklines */}
      {hist.length >= 2 && (
        <div className="card">
          <div className="section-head">
            <span className="eyebrow">Since baseline</span>
          </div>
          <div className="metric-chips">
            <div className="metric-chip">
              <div className="chip-k">Weight</div>
              <div className="chip-v tnum">{latest.weight}<span className="u">kg</span></div>
              <div className={`chip-d ${dW.cls}`}>{dW.sign} {dW.txt}</div>
              {wVals.length >= 2 && (() => { const s = spark(wVals, 80, 24, 2); return (
                <svg className="spark" viewBox="0 0 80 24" preserveAspectRatio="none">
                  <path d={s.path} fill="none" stroke="var(--accent)" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round"/>
                </svg>
              );})()}
            </div>
            <div className="metric-chip">
              <div className="chip-k">Body fat</div>
              <div className="chip-v tnum">{latest.bodyFat}<span className="u">%</span></div>
              <div className={`chip-d ${dBF.cls}`}>{dBF.sign} {dBF.txt}</div>
              {(() => { const s = spark(hist.map(h => h.bf), 80, 24, 2); return (
                <svg className="spark" viewBox="0 0 80 24" preserveAspectRatio="none">
                  <path d={s.path} fill="none" stroke="var(--accent)" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round"/>
                </svg>
              );})()}
            </div>
            <div className="metric-chip">
              <div className="chip-k">Lean mass</div>
              <div className="chip-v tnum lean" style={{color:"var(--info)"}}>{leanNow.toFixed(1)}<span className="u">kg</span></div>
              <div className={`chip-d ${dLean.cls}`}>{dLean.sign} {dLean.txt}</div>
              {(() => { const s = spark(hist.map(h => h.lean), 80, 24, 2); return (
                <svg className="spark" viewBox="0 0 80 24" preserveAspectRatio="none">
                  <path d={s.path} fill="none" stroke="var(--info)" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round"/>
                </svg>
              );})()}
            </div>
          </div>
          <div style={{fontSize:12, color:"var(--ink-3)", fontStyle:"italic", marginTop:12, lineHeight:1.5}}>
            Lean mass = weight × (1 − body fat%). It's the metric that actually matters for strength.
          </div>
        </div>
      )}

      {/* Log new measurement */}
      <div className="log-form">
        <div className="section-head">
          <span className="eyebrow">Log measurement</span>
        </div>
        <div className="form-grid">
          <div className="input-block">
            <label>Weight (kg)</label>
            <input value={form.weight} onChange={e => setForm(f=>({...f,weight:e.target.value}))} placeholder={String(latest.weight)} type="text" inputMode="decimal" pattern="[0-9]*\.?[0-9]*"/>
          </div>
          <div className="input-block">
            <label>Body fat (%)</label>
            <input value={form.bodyFat} onChange={e => setForm(f=>({...f,bodyFat:e.target.value}))} placeholder={String(latest.bodyFat)} type="text" inputMode="decimal" pattern="[0-9]*\.?[0-9]*"/>
          </div>
        </div>
        {form.weight && form.bodyFat && (
          <div className="lean-preview">
            lean mass · <strong className="tnum">{(parseNum(form.weight)*(1-parseNum(form.bodyFat)/100)).toFixed(1)}kg</strong> (auto)
          </div>
        )}
        <button
          className={`btn ${saved?"ghost":form.weight&&form.bodyFat?"accent":""}`}
          onClick={addEntry}
          disabled={!(parseNum(form.weight)>=30 && parseNum(form.weight)<=300) || !(parseNum(form.bodyFat)>=3 && parseNum(form.bodyFat)<=60)}
        >
          {saved ? "Logged ✓" : "Log measurement"}
        </button>
      </div>

      {/* History */}
      <div className="card">
        <div className="section-head">
          <span className="eyebrow">History</span>
        </div>
        {[...stats].reverse().map((s, ri) => {
          const i = stats.length - 1 - ri;
          const lean = (s.weight * (1 - s.bodyFat/100)).toFixed(1);
          const isFirst = i === 0;
          return (
            <div key={i} className="bh-row">
              <div className="bh-l">
                <div style={{display:"flex", gap:10, alignItems:"baseline"}}>
                  <span className="bh-date">{s.date}</span>
                  <span className="bh-main tnum">{s.weight}kg</span>
                </div>
                <div className="bh-sub">
                  <span>BF <span className="bf tnum">{s.bodyFat}%</span></span>
                  <span>Lean <span className="lean tnum">{lean}kg</span></span>
                </div>
              </div>
              {!isFirst ? (
                <button className="del-btn" onClick={() => setStats(prev => prev.filter((_,idx) => idx !== i))}>⌫</button>
              ) : (
                <span className="bh-baseline">baseline</span>
              )}
            </div>
          );
        })}
      </div>

      {/* Theme switcher */}
      <div className="card">
        <div className="section-head">
          <span className="eyebrow">Appearance</span>
        </div>
        <div className="theme-grid">
          {[
            { id: "carbon",    name: "Carbon",    sub: "Default · graphite + ember",    bg: "#0e0e10", ink: "#f2f0ea", accent: "#ff4b1f" },
            { id: "blueprint", name: "Blueprint", sub: "Indigo + cyan · drafting grid", bg: "#0c1a2e", ink: "#eaf2ff", accent: "#6de3ff" },
          ].map(t => (
            <button
              key={t.id}
              className={`theme-card ${theme === t.id ? "on" : ""}`}
              onClick={() => setTheme(t.id)}
              style={{background: t.bg, color: t.ink}}
            >
              <div className="theme-swatches">
                <span className="sw ink" style={{background: t.ink}}/>
                <span className="sw accent" style={{background: t.accent}}/>
              </div>
              <div className="theme-name">{t.name}</div>
              <div className="theme-sub">{t.sub}</div>
              {theme === t.id && (
                <div className="theme-check" style={{color: t.accent, borderColor: t.accent}}>✓</div>
              )}
            </button>
          ))}
        </div>
        <div className="app-version">Gym Tracker · v8.6 — Restart</div>
      </div>

      <DataBackup />
    </>
  );
}

// ─── DATA BACKUP ─────────────────────────────────────────────────────────────
function DataBackup() {
  const [status, setStatus] = useState("");
  const keys = ["phul_phase","phul_stats","phul_logs","phul_diet","phul_draft","phul_makeup_draft","phul_meals","phul_custom_sessions","phul_theme","phul_dismissed_makeups","phul_program","phul_migration_v"];

  const exportData = () => {
    const data = {};
    keys.forEach(k => { const v = lsGet(k); if (v !== null) data[k] = v; });
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type:"application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url;
    a.download = `phul-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setStatus("exported ✓");
    setTimeout(() => setStatus(""), 2000);
  };

  // Validate shapes BEFORE writing anything — a bad or old backup must never
  // partially overwrite good data or persist a value that white-screens the app.
  const okType = {
    phul_phase:  v => v === "bulk" || v === "cut",
    phul_stats:  v => Array.isArray(v) && v.length > 0,
    phul_logs:   v => v && typeof v === "object" && !Array.isArray(v),
    phul_diet:   v => v && typeof v === "object" && !Array.isArray(v),
    phul_draft:  v => v === null || (v && typeof v === "object" && !Array.isArray(v)),
    phul_makeup_draft: v => v === null || (v && typeof v === "object" && !Array.isArray(v)),
    phul_meals:  v => Array.isArray(v),
    phul_custom_sessions: v => Array.isArray(v),
    phul_theme:  v => typeof v === "string",
    phul_dismissed_makeups: v => Array.isArray(v),
  };
  const importData = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      let data;
      try { data = JSON.parse(ev.target.result); }
      catch { setStatus("error — not valid JSON"); setTimeout(() => setStatus(""), 3000); return; }
      const present = keys.filter(k => data[k] !== undefined);
      if (!present.length) { setStatus("error — no recognizable data in file"); setTimeout(() => setStatus(""), 3000); return; }
      const bad = present.filter(k => okType[k] && !okType[k](data[k]));
      if (bad.length) { setStatus(`error — bad data for: ${bad.join(", ")}`); setTimeout(() => setStatus(""), 4000); return; }
      // All-or-nothing: only writes once every present key validates.
      present.forEach(k => lsSet(k, data[k]));
      setStatus("imported ✓ — reload to see data");
      setTimeout(() => window.location.reload(), 1500);
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div className="backup-card">
      <div className="bk">Data backup</div>
      <div className="desc">Export before updating the app file. Import after to restore.</div>
      <div className="btn-row">
        <button className="export" onClick={exportData}>Export ↓</button>
        <label className="import" style={{textAlign:"center", display:"block", padding:13, background:"var(--card-2)", border:"1px solid var(--line-2)", borderRadius:10, color:"var(--ink-2)", fontFamily:"var(--font-mono)", fontSize:13, fontWeight:800, letterSpacing:"0.16em", textTransform:"uppercase"}}>
          Import ↑
          <input type="file" accept=".json" onChange={importData} style={{display:"none"}}/>
        </label>
      </div>
      {status && <div className="status">{status}</div>}
    </div>
  );
}

// Error boundary — a single render-time throw (e.g. one corrupt value) would
// otherwise unmount React and white-screen the app permanently, with no way to
// reach the export/import UI. This shows a recovery screen instead.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("PHUL crashed during render:", error, info); }
  exportBackup() {
    try {
      const keys = ["phul_phase","phul_stats","phul_logs","phul_diet","phul_draft","phul_makeup_draft","phul_meals","phul_custom_sessions","phul_theme","phul_dismissed_makeups","phul_program","phul_migration_v"];
      const data = {};
      keys.forEach(k => { try { const v = localStorage.getItem(k); if (v != null) data[k] = JSON.parse(v); } catch {} });
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "phul-backup-recovery.json";
      a.click();
    } catch (e) { console.warn(e); }
  }
  clearDrafts() {
    try { localStorage.removeItem("phul_draft"); localStorage.removeItem("phul_makeup_draft"); } catch {}
    location.reload();
  }
  render() {
    if (!this.state.error) return this.props.children;
    const wrap = { minHeight:"100dvh", background:"#0e0e10", color:"#f2f0ea", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:14, padding:24, fontFamily:"system-ui, -apple-system, sans-serif", textAlign:"center" };
    const btn  = { width:"100%", maxWidth:320, padding:"15px", borderRadius:12, border:"1px solid rgba(255,255,255,0.18)", background:"#1b1b1f", color:"#f2f0ea", fontSize:15, fontWeight:700 };
    return (
      <div style={wrap}>
        <div style={{fontSize:40}}>🛠️</div>
        <div style={{fontSize:20, fontWeight:800}}>Something glitched</div>
        <div style={{fontSize:14, color:"#c9c6bd", lineHeight:1.5, maxWidth:340}}>
          The app hit an error while rendering, but <strong>your data is safe</strong> on this device. Export a backup first, then try clearing an unfinished session.
        </div>
        <button style={{...btn, background:"#ff4b1f", color:"#0e0e10", border:"none"}} onClick={() => this.exportBackup()}>Export backup ↓</button>
        <button style={btn} onClick={() => this.clearDrafts()}>Clear unfinished session &amp; reload</button>
        <button style={btn} onClick={() => location.reload()}>Just reload</button>
        <div style={{fontSize:11, color:"#7f7c74", marginTop:8, maxWidth:340, wordBreak:"break-word"}}>{String((this.state.error && this.state.error.message) || this.state.error)}</div>
      </div>
    );
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
