    </div>
  );
}

// ─── BODY ANALYSIS ENGINE ────────────────────────────────────────────────────
// Thresholds calibrated for 23yo male, bulk/cut cycle
const BF_BULK_STOP  = 18;   // stop bulk, start cut
const BF_CUT_TARGET = 12;   // summer target
const BF_IDEAL_BULK = 14;   // ideal bulk start point
const WEIGHT_NOISE  = 0.5;  // kg — within this = "stable"
const BF_NOISE      = 0.4;  // % — within this = "stable"

function analyseProgress(stats, phase) {
  if (stats.length < 2) return null;
  const latest = stats[stats.length - 1];
  const prev   = stats[stats.length - 2];

  const wDelta  = latest.weight  - prev.weight;
  const bfDelta = latest.bodyFat - prev.bodyFat;

  // Derived fat mass change in kg
  const fatKgNow  = latest.weight * (latest.bodyFat / 100);
  const fatKgPrev = prev.weight   * (prev.bodyFat   / 100);
  const fatKgDelta = fatKgNow - fatKgPrev;

  // Lean mass change
  const leanNow  = latest.weight - fatKgNow;
  const leanPrev = prev.weight   - fatKgPrev;
  const leanDelta = leanNow - leanPrev;

  const wUp   = wDelta  >  WEIGHT_NOISE;
  const wDown = wDelta  < -WEIGHT_NOISE;
  const wFlat = !wUp && !wDown;
  const bfUp  = bfDelta >  BF_NOISE;
  const bfDn  = bfDelta < -BF_NOISE;
  const bfFlt = !bfUp && !bfDn;

  let scenario, emoji, color, advice;

  if (phase === "bulk") {
    if (wUp && bfFlt)       { scenario = "Clean bulk"; emoji = "✅"; color = "#00e87a"; advice = "Weight up, body fat stable. You're building muscle cleanly. Keep it up."; }
    else if (wUp && bfDn)   { scenario = "Exceptional bulk"; emoji = "🔥"; color = "#00e87a"; advice = "Weight up AND body fat dropping. You're gaining muscle faster than fat. Rare — keep doing exactly what you're doing."; }
    else if (wUp && bfUp)   { scenario = "Dirty bulk"; emoji = "⚠️"; color = "#ffc94d"; advice = `Weight and body fat both rising. You're gaining too much fat. Consider dropping ~200 kcal/day or cleaning up food quality.${latest.bodyFat >= BF_BULK_STOP ? " You're at " + latest.bodyFat + "% — time to consider switching to cut." : ""}`; }
    else if (wFlat && bfDn) { scenario = "Recomposition"; emoji = "🔥"; color = "#00e87a"; advice = "Weight stable but body fat dropping — you're losing fat while gaining muscle simultaneously. This is ideal for your level."; }
    else if (wFlat && bfFlt){ scenario = "Stalled"; emoji = "⏸"; color = "#ffc94d"; advice = "Nothing is changing. You're likely at maintenance. Increase calories by 150-200 kcal/day to restart the bulk."; }
    else if (wDown && bfFlt){ scenario = "Losing muscle"; emoji = "🚨"; color = "#ff4d1c"; advice = "Weight dropping but body fat staying the same — you're losing lean mass. Increase calories and check protein intake (target 155g/day)."; }
    else if (wDown && bfDn) { scenario = "Cutting in bulk phase"; emoji = "⚠️"; color = "#ffc94d"; advice = "You're losing both fat and weight — you're in a deficit during your bulk. Eat more."; }
    else                    { scenario = "Mixed signals"; emoji = "🔍"; color = "#7888a0"; advice = "Changes are within noise range. Log another measurement in a week to see a clearer trend."; }
  } else {
    // cut phase
    if (wDown && bfDn)      { scenario = "Clean cut"; emoji = "✅"; color = "#00e87a"; advice = `Losing weight and body fat together — textbook cut. Muscle is being preserved. ${latest.bodyFat <= BF_CUT_TARGET ? "You're approaching your summer target of " + BF_CUT_TARGET + "%! 🎯" : "Keep going."}`; }
    else if (wDown && bfFlt){ scenario = "Losing muscle"; emoji = "🚨"; color = "#ff4d1c"; advice = "Weight dropping but body fat not moving — you're losing lean mass, not fat. Deficit is too aggressive or protein too low. Reduce deficit and up protein."; }
    else if (wDown && bfUp) { scenario = "Muscle loss"; emoji = "🚨"; color = "#ff4d1c"; advice = "Weight down and body fat % rising — you're losing muscle faster than fat. Serious red flag. Cut the deficit and prioritise protein."; }
    else if (wFlat && bfDn) { scenario = "Recomposition"; emoji = "🔥"; color = "#00e87a"; advice = "Weight stable, body fat dropping — gaining muscle while losing fat. Best case scenario during a cut."; }
    else if (wFlat && bfFlt){ scenario = "Stalled"; emoji = "⏸"; color = "#ffc94d"; advice = "No change. Either your deficit is too small or your body has adapted. Try reducing calories by 100-150 kcal or adding a short walk after meals."; }
    else if (wUp && bfDn)   { scenario = "Muscle gain dominant"; emoji = "✅"; color = "#00e87a"; advice = "Weight slightly up but body fat dropping — you're building muscle faster than expected during a cut. Keep it up."; }
    else                    { scenario = "Mixed signals"; emoji = "🔍"; color = "#7888a0"; advice = "Changes within noise range. Measure again in a week for a clearer picture."; }
  }

  // Phase-specific warnings
  let warning = null;
  if (phase === "bulk" && latest.bodyFat >= BF_BULK_STOP) {
    warning = { text: `Body fat at ${latest.bodyFat}% — above the ${BF_BULK_STOP}% bulk stop point. Consider switching to cut.`, color: "#ff4d1c" };
  } else if (phase === "cut" && latest.bodyFat <= BF_CUT_TARGET) {
    warning = { text: `Body fat at ${latest.bodyFat}% — you've hit your ${BF_CUT_TARGET}% summer target! 🎯`, color: "#00e87a" };
  }

  return { scenario, emoji, color, advice, warning, wDelta, bfDelta, fatKgDelta: fatKgDelta.toFixed(1), leanDelta: leanDelta.toFixed(1) };
}

// ─── STATS TAB ────────────────────────────────────────────────────────────────
function StatsTab({ stats, setStats, phase }) {
  const [form, setForm] = useState({ weight:"", bodyFat:"" });
  const [saved, setSaved] = useState(false);
  const latest = stats[stats.length-1];
  const first  = stats[0];
  const analysis = analyseProgress(stats, phase);

  const addEntry = () => {
    if (!form.weight || !form.bodyFat) return;
    const w  = parseNum(form.weight);
    const bf = parseNum(form.bodyFat);
    const e = {
      date: new Date().toISOString().slice(0,10),
      weight: w,
      bodyFat: bf,
      leanMass: parseFloat((w * (1 - bf/100)).toFixed(1)),
      height: latest.height,
      bmr: latest.bmr,
    };
    setStats(prev => [...prev, e]);
    setForm({ weight:"", bodyFat:"" });
    setSaved(true); setTimeout(() => setSaved(false), 2000);
  };

  const wDelta  = latest.weight  - first.weight;
  const bfDelta = latest.bodyFat - first.bodyFat;
  const leanNow   = latest.weight * (1 - latest.bodyFat/100);
  const leanFirst = first.weight  * (1 - first.bodyFat/100);
  const leanDelta = leanNow - leanFirst;

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:14 }}>

      {/* CURRENT STATS */}
      <div style={{ background:"#1a1d24", borderRadius:12, padding:16 }}>
        <div style={{ fontSize:12, color:"#7888a0", letterSpacing:2, marginBottom:14, fontWeight:700 }}>CURRENT</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginBottom:10 }}>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:10, color:"#506070", letterSpacing:2, marginBottom:6 }}>WEIGHT</div>
            <div style={{ fontSize:26, fontWeight:700, color:"#f0f0f0" }}>{latest.weight}<span style={{ fontSize:13, color:"#7888a0" }}>kg</span></div>
          </div>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:10, color:"#506070", letterSpacing:2, marginBottom:6 }}>BODY FAT</div>
            <div style={{ fontSize:26, fontWeight:700, color: latest.bodyFat >= BF_BULK_STOP ? "#ff4d1c" : latest.bodyFat <= BF_CUT_TARGET ? "#00e87a" : "#ffc94d" }}>{latest.bodyFat}<span style={{ fontSize:13, color:"#7888a0" }}>%</span></div>
          </div>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:10, color:"#506070", letterSpacing:2, marginBottom:6 }}>LEAN MASS</div>
            <div style={{ fontSize:26, fontWeight:700, color:"#3db8ff" }}>{leanNow.toFixed(1)}<span style={{ fontSize:13, color:"#7888a0" }}>kg</span></div>
          </div>
        </div>
        {/* BF range indicator */}
        <div style={{ marginTop:8 }}>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:"#506070", marginBottom:4 }}>
            <span>cut target {BF_CUT_TARGET}%</span>
            <span>bulk stop {BF_BULK_STOP}%</span>
          </div>
          <div style={{ height:6, background:"#21252e", borderRadius:3, position:"relative" }}>
            <div style={{ position:"absolute", left:`${Math.min(100,Math.max(0,(BF_CUT_TARGET/25)*100))}%`, height:"100%", width:`${((BF_BULK_STOP-BF_CUT_TARGET)/25)*100}%`, background:"#00e87a22", borderRadius:3 }}/>
            <div style={{ position:"absolute", left:`${Math.min(98,Math.max(0,((latest.bodyFat)/25)*100))}%`, top:-2, width:10, height:10, background:"#ff4d1c", borderRadius:"50%", transform:"translateX(-50%)" }}/>
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:"#506070", marginTop:4 }}>
            <span>lean</span><span>healthy</span><span>cut now</span>
          </div>
        </div>
        <div style={{ fontSize:10, color:"#506070", marginTop:8, textAlign:"right" }}>last updated {latest.date}</div>
      </div>

      {/* ANALYSIS */}
      {analysis && (
        <div style={{ background:"#1a1d24", borderRadius:12, padding:16, borderLeft:`3px solid ${analysis.color}` }}>
          <div style={{ fontSize:12, color:"#7888a0", letterSpacing:2, marginBottom:12, fontWeight:700 }}>ANALYSIS</div>
          <div style={{ fontSize:18, fontWeight:700, color:analysis.color, marginBottom:8 }}>
            {analysis.emoji} {analysis.scenario}
          </div>
          <div style={{ fontSize:13, color:"#a0b0c0", lineHeight:1.6, marginBottom:14 }}>{analysis.advice}</div>
          {/* Delta breakdown */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:8, background:"#21252e", borderRadius:8, padding:10 }}>
            {[
              { label:"WEIGHT", val:(analysis.wDelta>0?"+":"")+analysis.wDelta.toFixed(1)+"kg", color: analysis.wDelta > 0 ? "#ff4d1c" : analysis.wDelta < 0 ? "#3db8ff" : "#7888a0" },
              { label:"FAT %", val:(analysis.bfDelta>0?"+":"")+analysis.bfDelta.toFixed(1)+"%", color: analysis.bfDelta > 0 ? "#ff4d1c" : analysis.bfDelta < 0 ? "#00e87a" : "#7888a0" },
              { label:"FAT kg", val:(analysis.fatKgDelta>0?"+":"")+analysis.fatKgDelta+"kg", color: Number(analysis.fatKgDelta) > 0 ? "#ff4d1c" : Number(analysis.fatKgDelta) < 0 ? "#00e87a" : "#7888a0" },
              { label:"LEAN", val:(analysis.leanDelta>0?"+":"")+analysis.leanDelta+"kg", color: Number(analysis.leanDelta) > 0 ? "#00e87a" : Number(analysis.leanDelta) < 0 ? "#ff4d1c" : "#7888a0" },
            ].map(d => (
              <div key={d.label} style={{ textAlign:"center" }}>
                <div style={{ fontSize:9, color:"#506070", letterSpacing:1, marginBottom:4 }}>{d.label}</div>

          {analysis.warning && (
            <div style={{ marginTop:10, padding:"8px 12px", background:analysis.warning.color+"15", borderRadius:8, fontSize:12, color:analysis.warning.color }}>
              ⚡ {analysis.warning.text}

          )}

      )}

      {/* PROGRESS FROM BASELINE */}
      <div style={{ background:"#1a1d24", borderRadius:12, padding:16 }}>
        <div style={{ fontSize:12, color:"#7888a0", letterSpacing:2, marginBottom:14, fontWeight:700 }}>SINCE BASELINE</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10 }}>
          {[
            { label:"WEIGHT", val:wDelta, unit:"kg", good:"pos" },
            { label:"BODY FAT", val:bfDelta, unit:"%", good:"neg" },
            { label:"LEAN MASS", val:leanDelta, unit:"kg", good:"pos" },

            const color = good==="pos" ? (val>0?"#00e87a":val<0?"#ff4d1c":"#7888a0") : (val<0?"#00e87a":val>0?"#ff4d1c":"#7888a0");
            return (
              <div key={label} style={{ textAlign:"center" }}>
                <div style={{ fontSize:9, color:"#506070", letterSpacing:2, marginBottom:6 }}>{label}</div>
                <div style={{ fontSize:16, fontWeight:700, color }}>{val>0?"+":""}{val.toFixed(1)}{unit}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* LOG NEW */}
      <div style={{ background:"#1a1d24", borderRadius:12, padding:16 }}>
        <div style={{ fontSize:12, color:"#7888a0", letterSpacing:2, marginBottom:14, fontWeight:700 }}>LOG MEASUREMENT</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:12 }}>
          <div>
            <div style={{ fontSize:11, color:"#8898b0", marginBottom:6 }}>WEIGHT (kg)</div>

              type="text" inputMode="decimal" pattern="[0-9]*\.?[0-9]*"
              style={{ width:"100%", background:"#21252e", border:"1px solid #2e3340", borderRadius:8, padding:"12px", color:"#f0f0f0", fontSize:18, textAlign:"center" }}/>
          </div>

            <input value={form.bodyFat} onChange={e => setForm(f=>({...f,bodyFat:e.target.value}))} placeholder={String(latest.bodyFat)}
              type="text" inputMode="decimal" pattern="[0-9]*\.?[0-9]*"
              style={{ width:"100%", background:"#21252e", border:"1px solid #2e3340", borderRadius:8, padding:"12px", color:"#f0f0f0", fontSize:18, textAlign:"center" }}/>
          </div>
        </div>
        {form.weight && form.bodyFat && (
          <div style={{ fontSize:12, color:"#506070", marginBottom:10, textAlign:"center" }}>
            lean mass: <span style={{ color:"#3db8ff", fontWeight:700 }}>{(parseNum(form.weight)*(1-parseNum(form.bodyFat)/100)).toFixed(1)}kg</span> (auto-calculated)
          </div>
        )}
        <button onClick={addEntry} disabled={!form.weight||!form.bodyFat||isNaN(parseNum(form.weight))||isNaN(parseNum(form.bodyFat))}
          style={{ width:"100%", background:saved?"#00e87a18":(!form.weight||!form.bodyFat)?"#1a1d24":"#3db8ff", border:saved?"1px solid #00e87a33":"none", borderRadius:8, padding:"13px", color:saved?"#00e87a":(!form.weight||!form.bodyFat)?"#3a4455":"#fff", fontWeight:700, fontSize:12, cursor:(!form.weight||!form.bodyFat)?"default":"pointer", letterSpacing:2 }}>
          {saved?"LOGGED ✓":"LOG MEASUREMENT"}
        </button>
      </div>

      {/* HISTORY */}
      <div style={{ background:"#1a1d24", borderRadius:12, padding:16 }}>
        <div style={{ fontSize:12, color:"#7888a0", letterSpacing:2, marginBottom:12, fontWeight:700 }}>HISTORY</div>
        {[...stats].reverse().map((s, ri) => {
          const i = stats.length - 1 - ri; // real index in stats array
          const lean = (s.weight * (1 - s.bodyFat/100)).toFixed(1);
          const isFirst = i === 0;
          return (
            <div key={i} style={{ padding:"10px 0", borderTop:ri>0?"1px solid #252b36":"none", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div>
                <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:4 }}>
                  <div style={{ fontSize:12, fontWeight:700 }}>{s.date}</div>
                  <div style={{ fontSize:13, color:"#c0ccd8", fontWeight:700 }}>{s.weight}kg</div>
                </div>
                <div style={{ display:"flex", gap:16, fontSize:11, color:"#8898b0" }}>
                  <span>BF <span style={{ color:"#ffc94d" }}>{s.bodyFat}%</span></span>
                  <span>Lean <span style={{ color:"#3db8ff" }}>{lean}kg</span></span>
                </div>
              </div>
              {!isFirst && (
                <button onClick={() => setStats(prev => prev.filter((_,idx) => idx !== i))}
                  style={{ background:"none", border:"1px solid #2e3340", borderRadius:6, padding:"5px 10px", color:"#506070", fontSize:11, cursor:"pointer" }}>
                  🗑
                </button>
              )}
              {isFirst && <span style={{ fontSize:10, color:"#3a4455" }}>baseline</span>}
            </div>
          );
        })}
      </div>

      <DataBackup />
    </div>
  );
}

// ─── DATA BACKUP ─────────────────────────────────────────────────────────────
function DataBackup() {
  const [status, setStatus] = useState("");
  const keys = ["phul_phase","phul_stats","phul_logs","phul_diet","phul_draft"];

  const exportData = () => {
    const data = {};
    keys.forEach(k => { const v = lsGet(k); if (v !== null) data[k] = v; });
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type:"application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url;
    a.download = `phul-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setStatus("exported ✓");
    setTimeout(() => setStatus(""), 2000);
  };

  const importData = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        keys.forEach(k => { if (data[k] !== undefined) lsSet(k, data[k]); });
        setStatus("imported ✓ — reload to see data");
        setTimeout(() => window.location.reload(), 1500);
      } catch {
        setStatus("error — invalid file");
        setTimeout(() => setStatus(""), 3000);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div style={{ background:"#1a1d24", borderRadius:12, padding:16 }}>
      <div style={{ fontSize:12, color:"#7888a0", letterSpacing:2, marginBottom:6, fontWeight:700 }}>DATA BACKUP</div>
      <div style={{ fontSize:12, color:"#506070", marginBottom:14, lineHeight:1.6 }}>
        Export before updating the app file. Import after to restore your data.
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
        <button onClick={exportData}
          style={{ background:"#ff4d1c", border:"none", borderRadius:8, padding:"12px", color:"#fff", fontWeight:700, fontSize:12, cursor:"pointer", letterSpacing:1 }}>
          EXPORT ↓
        </button>
        <label style={{ background:"#21252e", border:"1px solid #2e3340", borderRadius:8, padding:"12px", color:"#a0b0c0", fontWeight:700, fontSize:12, cursor:"pointer", letterSpacing:1, textAlign:"center", display:"block" }}>
          IMPORT ↑
          <input type="file" accept=".json" onChange={importData} style={{ display:"none" }}/>
        </label>
      </div>
      {status && (
        <div style={{ marginTop:10, fontSize:12, color:"#00e87a", textAlign:"center" }}>{status}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
