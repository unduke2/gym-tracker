<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="pragma" content="no-cache"/>
<meta http-equiv="expires" content="0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PHUL Tracker"/>
<meta name="theme-color" content="#0e0e10"/>
<title>PHUL Tracker</title>
<link rel="icon" type="image/svg+xml" href="icon.svg"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PHUL Tracker v5 — Carbon theme
   Generic CSS vars (retune-friendly). Single accent for power
   focus, second for hypertrophy, gold for PRs. Tabular nums
   everywhere a number might jitter.
   ========================================================= */
:root {
  /* Surface */
  --bg:        #0e0e10;
  --bg-2:      #17171a;
  --card:      #1b1b1f;
  --card-2:    #21212a;

  /* Ink */
  --ink:       #f2f0ea;
  --ink-2:     #c9c6bd;
  --ink-3:     #7f7c74;
  --ink-4:     #4a4842;

  /* Hairlines */
  --line:      rgba(255,255,255,0.06);
  --line-2:    rgba(255,255,255,0.14);

  /* Semantic accents */
  --accent:       #ff4b1f;  /* primary — now / focus / power */
  --accent-ink:   #0e0e10;
  --accent-power: #ff4b1f;  /* Power days, heavy low reps */
  --accent-hyper: #3fd9bd;  /* Hypertrophy, volume */
  --accent-full:  #4a9eff;  /* Full-body days */
  --accent-gold:  #e8b14a;  /* PR achievement */
  --accent-hold:  #ffb547;  /* Held / paused exercise */
  --ok:           #4ecb7a;
  --warn:         #e8b547;
  --bad:          #ff5a3a;
  --info:         #5db8ff;  /* protein / lean mass */

  /* Plate edge — keeps dark plates legible on dark bg */
  --plate-edge:   rgba(0,0,0,0.35);

  /* Type */
  --font:        "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-num:    "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-serif:  "Instrument Serif", ui-serif, Georgia, serif;
  --font-mono:   "JetBrains Mono", ui-monospace, monospace;

  /* Shape */
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  16px;
  --r-xl:  20px;

  /* Safe areas (iPhone notch / home indicator) */
  --sa-top:    env(safe-area-inset-top, 0px);
  --sa-bot:    env(safe-area-inset-bottom, 0px);
  --sa-left:   env(safe-area-inset-left, 0px);
  --sa-right:  env(safe-area-inset-right, 0px);
}

/* ═══════════════════════════════════════════════════════
   THEME: BLUEPRINT — deep indigo + cyan, drafting paper
   ═══════════════════════════════════════════════════════ */
[data-theme="blueprint"] {
  --bg:          #0c1a2e;
  --bg-2:        #102742;
  --card:        #133052;
  --card-2:      #183a62;
  --ink:         #eaf2ff;
  --ink-2:       #b6c9e3;
  --ink-3:       #7690b0;
  --ink-4:       #425d7f;
  --line:        rgba(180,215,255,0.10);
  --line-2:      rgba(180,215,255,0.22);
  --accent:       #6de3ff;
  --accent-ink:   #0c1a2e;
  --accent-power: #ff7a59;
  --accent-hyper: #6de3ff;
  --accent-full:  #8fb8ff;
  --accent-gold:  #ffd36e;
  --accent-hold:  #ffc65a;
  --ok:          #7ee3b0;
  --warn:        #ffc65a;
  --bad:         #ff7a59;
  --info:        #a890ff;
  --plate-edge:  rgba(0,0,0,0.4);
}
/* Drafting-paper grid overlay on Blueprint */
[data-theme="blueprint"] body {
  background-image:
    linear-gradient(rgba(180,215,255,0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(180,215,255,0.045) 1px, transparent 1px);
  background-size: 24px 24px, 24px 24px;
}
[data-theme="blueprint"] .app {
  background:
    radial-gradient(ellipse at top, rgba(109,227,255,0.04), transparent 60%),
    transparent;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-feature-settings: "ss01", "tnum";
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
input, textarea, button, select { font-family: var(--font); color: var(--ink); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent) !important; }
button { cursor: pointer; }
::-webkit-scrollbar { display: none; }

/* ─── TYPE UTILITIES ─── */
.eyebrow {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.eyebrow-accent { color: var(--accent); }
.eyebrow-power  { color: var(--accent-power); }
.eyebrow-hyper  { color: var(--accent-hyper); }
.eyebrow-gold   { color: var(--accent-gold); }
.eyebrow-power::before,
.eyebrow-hyper::before {
  content: ""; display: inline-block;
  width: 7px; height: 7px; border-radius: 2px;
  margin-right: 7px; vertical-align: middle;
  position: relative; top: -1px;
}
.eyebrow-power::before { background: var(--accent-power); }
.eyebrow-hyper::before { background: var(--accent-hyper); }

.h-hero { font-size: 44px; font-weight: 800; letter-spacing: -0.035em; line-height: 0.95; color: var(--ink); margin: 0; }
.h-1 { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; color: var(--ink); margin: 0; }
.h-1 em, .h-hero em, .next-title em {
  font-family: var(--font-serif);
  font-weight: 400; font-style: italic;
  letter-spacing: -0.01em;
}
.tnum { font-variant-numeric: tabular-nums; }
.unit { font-size: 0.5em; font-weight: 500; color: var(--ink-3); margin-left: 3px; letter-spacing: -0.01em; }

/* ─── APP SHELL ─── */
#root { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.app {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh; min-height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  padding-bottom: calc(var(--sa-bot) + 92px); /* tab bar + safe area */
}

/* Sticky top header — title + phase pill */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid var(--line);
  padding:
    calc(var(--sa-top) + 18px)
    calc(var(--sa-right) + 20px)
    12px
    calc(var(--sa-left) + 20px);
}
.app-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.app-title-wrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.app-kicker {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.24em;
  color: var(--ink-3);
  text-transform: uppercase;
  font-weight: 600;
}
.app-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.025em;
  color: var(--ink);
}
.app-title em {
  font-family: var(--font-serif);
  font-weight: 400; font-style: italic;
  color: var(--ink-2);
  letter-spacing: -0.01em;
}

/* Bulk/Cut phase pill */
.phase-pill {
  background: transparent;
  border: 1px solid color-mix(in oklab, var(--accent) 45%, var(--line-2));
  color: var(--accent);
  padding: 7px 14px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  font-weight: 700;
  text-transform: uppercase;
  white-space: nowrap;
}
.phase-pill.cut {
  border-color: color-mix(in oklab, var(--info) 45%, var(--line-2));
  color: var(--info);
}

/* Main scroll area */
.app-main {
  flex: 1;
  padding:
    18px
    calc(var(--sa-right) + 20px)
    20px
    calc(var(--sa-left) + 20px);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.app-main.session-mode {
  padding: 0;
  gap: 0;
}

/* Bottom tab bar — fixed, safe-area aware */
.tabbar {
  position: fixed;
  left: 0; right: 0;
  bottom: 0;
  z-index: 50;
  background: color-mix(in oklab, var(--bg) 94%, transparent);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-top: 1px solid var(--line);
  padding:
    10px
    calc(var(--sa-right) + 10px)
    calc(var(--sa-bot) + 10px)
    calc(var(--sa-left) + 10px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  max-width: 480px;
  margin: 0 auto;
}
.tab {
  background: none; border: none;
  color: var(--ink-3);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 4px 4px;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 12px;
}
.tab svg { display: block; }
.tab.on { color: var(--ink); }
.tab.on .tab-dot { opacity: 1; }
.tab-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent);
  opacity: 0;
  margin-top: 1px;
}

/* ─── CARDS ─── */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
}
.card .section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}
.card .section-head .more {
  background: none; border: none;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  color: var(--ink-3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ─── BUTTONS ─── */
.btn {
  width: 100%;
  background: var(--ink);
  color: var(--bg);
  border: none;
  border-radius: var(--r-md);
  padding: 16px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  -webkit-appearance: none;
  appearance: none;
}
.btn:active { transform: scale(0.99); }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ok { background: var(--ok); color: #051a0d; }
.btn.ghost {
  background: transparent;
  color: var(--ink-2);
  border: 1px solid var(--line-2);
}
.btn.ghost:active { background: var(--card-2); }
.btn.danger { background: var(--bad); color: var(--ink); }
/* Dim the button but keep its accent/ok/ghost coloring so text stays readable. */
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.huge { padding: 20px 22px; font-size: 16px; border-radius: 14px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Ghost pill button row (Edit / Taken / Skip etc.) */
.pill-btns {
  display: grid;
  grid-template-columns: repeat(var(--cols, 3), 1fr);
  gap: 8px;
}
.pill-btns button {
  background: transparent;
  border: 1px solid var(--line-2);
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  color: var(--ink-2);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 11px 6px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  gap: 5px;
}
.pill-btns button:hover { border-color: var(--ink-2); color: var(--ink); }
.pill-btns button.warn { border-color: color-mix(in oklab, var(--accent-hold) 50%, var(--line-2)); color: var(--accent-hold); }
.pill-btns button.danger { border-color: color-mix(in oklab, var(--bad) 50%, var(--line-2)); color: var(--bad); }
.pill-btns button svg { opacity: 0.6; }

/* ─── PILL ─── */
.pill {
  display: inline-flex; align-items: center;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  background: color-mix(in oklab, var(--ink) 8%, transparent);
  color: var(--ink-2);
}
.pill.power { background: color-mix(in oklab, var(--accent-power) 14%, transparent); color: var(--accent-power); }
.pill.hyper { background: color-mix(in oklab, var(--accent-hyper) 14%, transparent); color: var(--accent-hyper); }
.pill.gold  { background: color-mix(in oklab, var(--accent-gold) 14%, transparent); color: var(--accent-gold); }
.pill.hold  { background: color-mix(in oklab, var(--accent-hold) 14%, transparent); color: var(--accent-hold); }
.pill.ok    { background: color-mix(in oklab, var(--ok) 14%, transparent); color: var(--ok); }

/* ─── THIN BAR (macro/kcal) ─── */
.thin-bar {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.thin-bar > i {
  display: block; height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.5s ease;
}

/* ─── DASHBOARD ─── */
.next-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px 22px 20px;
  position: relative;
  overflow: hidden;
}
.next-card .label-row {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.next-card .subtitle {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: nowrap;
}
.next-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  margin: 0 0 6px;
  color: var(--ink);
}
.next-desc {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  line-height: 1.5;
}
.next-meta-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px;
  align-items: center;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.next-meta-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  min-width: 0;
}
.next-meta-spark {
  width: 84px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  flex-shrink: 0;
}
.next-meta-spark svg {
  width: 100%;
  height: 28px;
  display: block;
  opacity: 0.9;
}
.next-meta-spark .nms-cap {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--ink-4);
  text-transform: uppercase;
  font-weight: 600;
  line-height: 1;
}
.next-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.next-meta-val {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.next-meta-val.delta-up { color: var(--ok); }
.next-meta-val.delta-down { color: var(--bad); }
.next-meta-val.delta-flat { color: var(--ink-2); }
.next-meta-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  text-transform: uppercase;
}

.start-btn {
  margin-top: 18px;
  width: 100%;
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  border-radius: 14px;
  padding: 18px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.02em;
  display: flex; align-items: center; justify-content: center;
  gap: 10px;
}
.start-btn .arrow { transition: transform 0.2s; }
.start-btn:hover .arrow { transform: translateX(3px); }
.start-btn:active { transform: scale(0.99); }

/* Catch-up card — pending makeups from abandoned exercises */
.catchup-card {
  background: color-mix(in oklab, var(--accent-hold) 7%, var(--card));
  border: 1px solid color-mix(in oklab, var(--accent-hold) 32%, var(--line));
  border-radius: var(--r-lg);
  padding: 16px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.catchup-card .section-head { margin-bottom: 4px; }
.catchup-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: left;
  width: 100%;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent-hold);
  border-radius: 10px;
  padding: 11px 14px;
  color: var(--ink);
  font-family: var(--font);
}
.catchup-group.power { border-left-color: var(--accent-power); }
.catchup-group.hyper { border-left-color: var(--accent-hyper); }
.catchup-group:active { transform: scale(0.995); }
.catchup-group-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
}
.catchup-group-head .cg-day {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.catchup-group-head .cg-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  font-weight: 600;
}
.catchup-ex-list {
  font-size: 12px;
  color: var(--ink-2);
  line-height: 1.5;
}

/* Catch-up modal — per-exercise row with dismiss action */
.catchup-item-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}
.catchup-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.catchup-item-l { flex: 1; min-width: 0; }
.catchup-item-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.catchup-item-sub {
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--ink-4);
}
.catchup-item-dismiss {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  padding: 7px 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 700;
  -webkit-appearance: none;
  appearance: none;
}
.catchup-item-dismiss:active {
  background: var(--bg-2);
  color: var(--ink-2);
  transform: scale(0.97);
}

/* Unfinished session banner */
.draft-banner {
  background: color-mix(in oklab, var(--accent-hold) 12%, var(--card));
  border: 1px solid color-mix(in oklab, var(--accent-hold) 40%, var(--line));
  border-radius: var(--r-md);
  padding: 14px 16px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px;
}
.draft-banner .dk {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--accent-hold);
  font-weight: 700;
  margin-bottom: 3px;
}
.draft-banner .dv { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
.draft-banner button {
  background: var(--accent-hold);
  border: none;
  color: #1a1200;
  font-weight: 800;
  padding: 9px 16px;
  border-radius: 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* Week strip */
.week-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.week-cell {
  display: flex; flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 12px 4px 10px;
  border-radius: 12px;
  background: transparent;
  border: 1px solid var(--line);
}
.week-cell .wc-dow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ink-3);
  text-transform: uppercase;
  font-weight: 600;
}
.week-cell .wc-mark {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 8px;
  font-size: 13px;
  font-family: var(--font-mono);
  font-weight: 700;
  background: transparent;
  border: 1px solid var(--line-2);
  color: var(--ink-4);
}
.week-cell .wc-tag {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-4);
  font-weight: 700;
  min-height: 10px;
}
.week-cell.power .wc-mark { background: color-mix(in oklab, var(--accent-power) 14%, transparent); border-color: color-mix(in oklab, var(--accent-power) 38%, transparent); color: var(--accent-power); }
.week-cell.power .wc-tag  { color: var(--accent-power); }
.week-cell.hyper .wc-mark { background: color-mix(in oklab, var(--accent-hyper) 14%, transparent); border-color: color-mix(in oklab, var(--accent-hyper) 38%, transparent); color: var(--accent-hyper); }
.week-cell.hyper .wc-tag  { color: var(--accent-hyper); }
.week-cell.done .wc-mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.week-cell.done.power .wc-mark { background: var(--accent-power); border-color: var(--accent-power); color: var(--accent-ink); }
.week-cell.done.hyper .wc-mark { background: var(--accent-hyper); border-color: var(--accent-hyper); color: var(--bg); }

/* Recent PRs */
.pr-list { display: flex; flex-direction: column; }
.pr-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: baseline;
  gap: 14px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.pr-row:last-child { border-bottom: none; }
.pr-lift { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.pr-weight {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.pr-weight .u { font-size: 11px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
.pr-delta {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  color: var(--ok);
  letter-spacing: 0.04em;
}
.pr-delta.flat { color: var(--ink-4); }
.pr-row.is-pr .pr-weight::after {
  content: "PR";
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--accent-gold);
  background: color-mix(in oklab, var(--accent-gold) 14%, transparent);
  padding: 2px 5px;
  border-radius: 3px;
  margin-left: 6px;
  vertical-align: middle;
  position: relative; top: -2px;
}
.pr-row.is-pr .pr-delta { color: var(--accent-gold); }

/* ─── SESSION SCREEN ─── */
.session {
  background: var(--bg);
  min-height: 100vh; min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.session-top {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid var(--line);
  padding:
    calc(var(--sa-top) + 14px)
    calc(var(--sa-right) + 18px)
    12px
    calc(var(--sa-left) + 18px);
}
.session-top-row {
  display: flex; justify-content: space-between;
  align-items: center; gap: 10px;
}
.session-day-k {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  font-weight: 700;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 7px;
}
.session-day-k .dot {
  width: 8px; height: 8px; border-radius: 2px;
}
.session-day-k.power { color: var(--accent-power); }
.session-day-k.power .dot { background: var(--accent-power); }
.session-day-k.hyper { color: var(--accent-hyper); }
.session-day-k.hyper .dot { background: var(--accent-hyper); }
.session-progress {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--ink-2);
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
.session-progress .done-n { color: var(--ink); font-weight: 700; }

/* Default chip: accent-tinted edge + accent minutes, no background tint.
   Color shifts ONLY when close-time is at risk (tight / over). Pace
   (ahead/on pace/behind) is text-only — doesn't drive chip color. */
.eta-chip {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--ink);
  background: transparent;
  border: 1px solid color-mix(in oklab, var(--accent) 40%, var(--line-2));
  padding: 4px 10px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.eta-chip .eta-dur {
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}
.eta-chip .eta-pace {
  font-weight: 500;
  letter-spacing: 0.06em;
  opacity: 0.7;
  text-transform: lowercase;
  color: var(--ink-3);
}
.eta-chip .eta-warn {
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: lowercase;
}
/* Tight — within 15 min of gym close: amber */
.eta-chip.tight {
  color: var(--warn);
  border-color: color-mix(in oklab, var(--warn) 45%, transparent);
  background: color-mix(in oklab, var(--warn) 8%, transparent);
}
.eta-chip.tight .eta-dur { color: var(--warn); }
/* Over — projected past gym close: red, subtle pulse */
.eta-chip.over {
  color: var(--bad);
  border-color: color-mix(in oklab, var(--bad) 50%, transparent);
  background: color-mix(in oklab, var(--bad) 10%, transparent);
  animation: eta-over-pulse 2.2s ease-in-out infinite;
}
.eta-chip.over .eta-dur { color: var(--bad); }
@keyframes eta-over-pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--bad) 30%, transparent); }
  50%      { box-shadow: 0 0 0 4px color-mix(in oklab, var(--bad) 0%, transparent); }
}
.session-ctl { display: flex; gap: 6px; }
.session-ctl button {
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  padding: 7px 12px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.session-ctl button.danger { border-color: color-mix(in oklab, var(--bad) 45%, transparent); color: var(--bad); }
.session-ctl .discard-btn {
  padding: 7px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.session-ctl .discard-btn svg { display: block; }
.session-progress-bar {
  height: 2px;
  background: var(--line);
  border-radius: 1px;
  margin-top: 12px;
  overflow: hidden;
}
.session-progress-bar > i {
  display: block; height: 100%;
  border-radius: 1px;
  transition: width 0.4s ease;
}
.session-main {
  flex: 1;
  padding:
    18px
    calc(var(--sa-right) + 18px)
    calc(var(--sa-bot) + 24px)
    calc(var(--sa-left) + 18px);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Active exercise hero card */
.ex-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.ex-card .ex-head {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--line);
}
.ex-card .ex-meta-top {
  display: flex; justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.ex-card .ex-meta-top-left {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.ex-card .ex-name {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin: 4px 0 0;
  color: var(--ink);
}
.ex-card .ex-name .bar-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--accent);
  margin-left: 8px;
  font-weight: 700;
  vertical-align: middle;
  position: relative;
  top: -3px;
}
.ex-set-meta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.ex-set-meta .set-big {
  color: var(--accent);
  font-size: 14px;
  font-weight: 800;
}
.ex-set-meta .sep { color: var(--ink-4); }
.ex-set-meta .rep-range { color: var(--ink-2); }

/* Weight block */
.wblock {
  padding: 22px 20px 18px;
  text-align: center;
  border-bottom: 1px solid var(--line);
}
.wblock .eyebrow { margin-bottom: 10px; }
.wblock .weight {
  font-size: 92px;
  font-weight: 800;
  letter-spacing: -0.055em;
  line-height: 0.88;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: baseline;
}
.wblock .weight.plates-only {
  color: var(--accent);
}
.wblock .weight .u {
  font-size: 22px;
  font-weight: 500;
  color: var(--ink-3);
  letter-spacing: -0.01em;
  margin-left: 6px;
}
.wblock .target-line {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  margin-top: 14px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.wblock .target-line strong {
  color: var(--ink);
  font-size: 14px;
  font-weight: 800;
  margin: 0 3px;
}
.wblock .total-line {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 6px;
  letter-spacing: 0.04em;
}
.wblock .total-line strong {
  color: var(--ink-2);
  font-weight: 700;
}
.wblock .sug-note {
  margin-top: 10px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink-2);
  font-style: italic;
  padding: 0 10px;
}
.wblock .sug-note.ok { color: var(--ok); }
.wblock .sug-note.warn { color: var(--warn); }
.wblock .sug-note.bad { color: var(--bad); }
.wblock .sug-note.hold { color: var(--accent-hold); }
.wblock .sug-note.info { color: var(--accent-full); }

/* Plate diagram */
.barbell {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin-top: 22px;
  padding: 0 8px;
  min-height: 120px;
}
.barbell .sleeve-end {
  width: 5px;
  height: 14px;
  background: var(--ink-3);
  opacity: 0.45;
  border-radius: 1px;
  flex-shrink: 0;
  margin: 0 3px;
}
.barbell .bar {
  flex: 0 0 auto;
  width: 44px;
  height: 6px;
  background: var(--ink-3);
  opacity: 0.6;
  border-radius: 1px;
}
.barbell .plates-group {
  display: flex;
  align-items: center;
  gap: 4px;
}
.barbell .plates-group.left { flex-direction: row-reverse; }
.plate {
  color: var(--bg);
  background: var(--ink);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font);
  font-weight: 800;
  letter-spacing: -0.02em;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px var(--plate-edge);
}
.plate .plate-val {
  transform: rotate(-90deg);
  white-space: nowrap;
  display: block;
}
.plate.p-25   { width: 22px; height: 112px; }
.plate.p-25   .plate-val { font-size: 15px; }
.plate.p-20   { width: 20px; height: 100px; }
.plate.p-20   .plate-val { font-size: 14px; }
.plate.p-15   { width: 18px; height: 88px; }
.plate.p-15   .plate-val { font-size: 13px; }
.plate.p-10   { width: 17px; height: 74px; }
.plate.p-10   .plate-val { font-size: 12px; }
.plate.p-5    { width: 15px; height: 60px; }
.plate.p-5    .plate-val { font-size: 11px; }
.plate.p-2-5  { width: 13px; height: 48px; background: var(--ink-2); }
.plate.p-2-5  .plate-val { font-size: 10px; }
.plate.p-1-25 { width: 12px; height: 36px; background: var(--ink-3); }
.plate.p-1-25 .plate-val { font-size: 9px; }
.barbell-legend {
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 8px;
  margin-top: 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  font-weight: 500;
  white-space: nowrap;
  flex-wrap: wrap;
}
.barbell-legend .per-side {
  color: var(--ink);
  font-weight: 800;
  font-family: var(--font);
  letter-spacing: -0.01em;
  font-size: 13px;
}
.barbell-legend .sep { color: var(--ink-4); }

/* Coach note */
.coach-note {
  padding: 12px 20px;
  background: var(--card-2);
  border-bottom: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.5;
  font-style: italic;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.coach-note .cn-mark {
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  font-weight: 700;
  text-transform: uppercase;
  flex-shrink: 0;
  font-style: normal;
  padding-top: 2px;
}

/* Ready/Active/Doing action area */
.ex-action {
  padding: 16px 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Active phase — mid-set hype screen */
.hype-block {
  text-align: center;
  padding: 14px 10px 18px;
}
.hype-block .hk {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 10px;
  text-transform: uppercase;
}
.hype-block .hv {
  font-size: 18px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--ink-2);
  font-style: italic;
  font-family: var(--font-serif);
  letter-spacing: -0.005em;
  text-wrap: balance;
}

/* Doing phase — inputs */
.input-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.input-block { display: flex; flex-direction: column; gap: 8px; }
.input-block label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.input-block input {
  width: 100%;
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  padding: 16px;
  color: var(--ink);
  font-size: 28px;
  font-weight: 800;
  text-align: center;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

/* RPE row */
.rpe-block { margin-top: 4px; }
.rpe-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.rpe-head .k {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.rpe-head .k em {
  font-family: var(--font-mono);
  font-style: normal;
  color: var(--ink-4);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: none;
}
.rpe-head .v {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 700;
  color: var(--accent-hold);
  letter-spacing: 0.08em;
}
.rpe-head .v.none { color: var(--ink-4); font-weight: 500; }
.rpe-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
}
.rpe-grid button {
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  padding: 10px 0;
  color: var(--ink-3);
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: all 0.1s;
}
.rpe-grid button.mid  { color: var(--accent-hold); }
.rpe-grid button.hard { color: var(--bad); }
.rpe-grid button.on {
  background: var(--accent-hold);
  border-color: var(--accent-hold);
  color: #1a1200;
}

/* Rest screen */
.rest-wrap {
  background: var(--card);
  border: 1px solid color-mix(in oklab, var(--accent) 20%, var(--line));
  border-radius: var(--r-lg);
  padding: 28px 20px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.rest-wrap .eyebrow { color: var(--accent); margin-bottom: 4px; }
.rest-wrap .next-up {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  text-transform: uppercase;
  margin-top: -8px;
}
.rest-wrap .next-up em {
  font-style: normal;
  color: var(--accent);
  font-weight: 700;
}
.rest-ring-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 240px;
  height: 240px;
}
.rest-ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.rest-ring circle {
  fill: none;
  stroke-width: 4;
  stroke-linecap: round;
}
.rest-ring .ring-track { stroke: var(--line-2); }
.rest-ring .ring-fill  { stroke: var(--accent); transition: stroke-dasharray 0.9s linear; }
.rest-clock {
  font-family: var(--font);
  font-size: 72px;
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: 0.9;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  position: relative;
  z-index: 1;
}
.rest-clock.warn { color: var(--ok); }
.rest-clock .sep { color: var(--ink-4); }
.rest-between {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  text-transform: uppercase;
  text-align: center;
}
.rest-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
  max-width: 340px;
  margin-top: 4px;
}
.rest-skip {
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  padding: 11px 18px;
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

/* Superset hint — shown when gym close is tight and a T3 pair has work left */
.superset-hint {
  background: color-mix(in oklab, var(--warn) 12%, var(--card));
  border: 1px solid color-mix(in oklab, var(--warn) 45%, transparent);
  border-radius: var(--r-md);
  padding: 12px 14px;
}
.superset-hint-k {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  font-weight: 800;
  color: var(--warn);
  text-transform: uppercase;
  margin-bottom: 5px;
}
.superset-hint-v {
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.5;
}
.superset-hint-v strong { color: var(--ink); font-weight: 800; }

/* Held chips */
.hold-list { display: flex; flex-direction: column; gap: 6px; }
.hold-head {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent-hold);
  letter-spacing: 0.2em;
  font-weight: 700;
  margin-bottom: 2px;
  text-transform: uppercase;
}
.hold-chip {
  background: color-mix(in oklab, var(--accent-hold) 10%, var(--card));
  border: 1px solid color-mix(in oklab, var(--accent-hold) 35%, var(--line));
  border-radius: 10px;
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.hold-chip-txt { flex: 1; min-width: 0; }
.hold-chip-name { font-size: 13px; font-weight: 700; color: var(--accent-hold); letter-spacing: -0.01em; }
.hold-chip-sub { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; margin-top: 2px; text-transform: uppercase; }
.hold-chip-btns { display: flex; gap: 6px; }
.hold-chip-btns button {
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  padding: 6px 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.hold-chip-btns .retry {
  background: var(--accent-hold);
  border-color: var(--accent-hold);
  color: #1a1200;
}
.hold-chip-btns .danger {
  border-color: color-mix(in oklab, var(--bad) 45%, transparent);
  color: var(--bad);
}

/* Exercise list (tier-grouped) */
.ex-list-head {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--ink-3);
  font-weight: 700;
  text-transform: uppercase;
  margin-top: 4px;
}
.tier-group { display: flex; flex-direction: column; gap: 6px; }
.tier-head {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--ink-4);
  font-weight: 700;
  text-transform: uppercase;
  padding: 0 2px;
}
.tier-head.done { color: color-mix(in oklab, var(--ok) 70%, transparent); }
.tier-head .t-label {
  color: var(--ink-3);
  font-weight: 800;
  margin-right: 6px;
}
.ex-row {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: all 0.15s;
  overflow: hidden;
}
.ex-row.active { border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); background: var(--card-2); }
.ex-row.done { border-color: color-mix(in oklab, var(--ok) 22%, var(--line)); }
.ex-row.held { border-color: color-mix(in oklab, var(--accent-hold) 40%, var(--line)); }
.ex-row.abandoned { opacity: 0.5; border-color: color-mix(in oklab, var(--bad) 22%, var(--line)); }
.ex-row-top {
  display: flex; align-items: center;
  padding: 12px 14px;
  gap: 10px;
}
.ex-row-top .status {
  width: 20px; height: 20px;
  display: grid; place-items: center;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-4);
}
.ex-row.active .ex-row-top .status { color: var(--accent); }
.ex-row.done .ex-row-top .status { color: var(--ok); }
.ex-row.held .ex-row-top .status { color: var(--accent-hold); }
.ex-row.abandoned .ex-row-top .status { color: var(--bad); }
.ex-row-body { flex: 1; min-width: 0; }
.ex-row-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  letter-spacing: -0.01em;
}
.ex-row.active .ex-row-name { font-weight: 800; color: var(--ink); }
.ex-row.done .ex-row-name { color: var(--ink-3); }
.ex-row.abandoned .ex-row-name { text-decoration: line-through; color: var(--ink-4); }
.ex-row-name .bar-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--accent);
  margin-left: 6px;
  letter-spacing: 0.14em;
  font-weight: 700;
}
.set-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.set-chip {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-3);
  background: color-mix(in oklab, var(--ink) 6%, transparent);
  border-radius: 4px;
  padding: 2px 6px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}
.ex-row.active .set-chip { color: var(--accent); }
.set-chip .rpe { color: var(--accent-hold); margin-left: 4px; }
.ex-row-right {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono);
}
.ex-row-right .set-count {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink-4);
  font-variant-numeric: tabular-nums;
}
.ex-row.active .ex-row-right .set-count { color: var(--accent); }
.ex-row.done .ex-row-right .set-count { color: var(--ok); }
.ex-row.held .ex-row-right .set-count { color: var(--accent-hold); }
.ex-row-right .set-count .tot { color: var(--ink-4); font-weight: 500; }
.ex-row-right .caret { color: var(--ink-4); font-size: 10px; }
.ex-row-expanded {
  padding: 0 14px 12px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ex-row-expanded .ere-head {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-4);
  font-weight: 700;
  margin: 10px 0 4px;
  text-transform: uppercase;
}
.set-editable {
  display: flex; justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 11px;
}
.set-editable:last-child { border-bottom: none; }
.set-editable .k { color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }
.set-editable button {
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  padding: 5px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
}
.set-editable button.dashed { border-style: dashed; color: var(--ink-3); }
.add-set-btn {
  width: 100%;
  background: none;
  border: 1px dashed var(--line-2);
  border-radius: 8px;
  padding: 9px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 600;
  margin-top: 4px;
}

/* Finish session CTA */
.finish-btn {
  width: 100%;
  padding: 18px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-family: var(--font-mono);
  border: 1px solid var(--line-2);
  background: var(--card);
  color: var(--ink-4);
  margin-top: 8px;
}
.finish-btn.ready {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

/* Edit-set modal */
.modal-bg {
  position: fixed;
  inset: 0;
  background: color-mix(in oklab, #000 70%, transparent);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-sheet {
  background: var(--card);
  border-top: 2px solid var(--accent);
  border-radius: 20px 20px 0 0;
  padding:
    22px
    calc(var(--sa-right) + 22px)
    calc(var(--sa-bot) + 22px)
    calc(var(--sa-left) + 22px);
  width: 100%;
  max-width: 480px;
  box-sizing: border-box;
}
.modal-sheet .modal-k {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 700;
  margin-bottom: 16px;
}

/* ─── STAT BAR (dashboard body/cals stats) ─── */
.stat-bar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px 12px 12px;
  min-width: 0;
  overflow: hidden;
}
.stat-card .eyebrow { margin-bottom: 10px; }
.stat-card .v {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: clip;
}
.stat-card .v .u { font-size: 11px; font-weight: 500; color: var(--ink-3); margin-left: 2px; letter-spacing: -0.01em; }
.stat-card .delta {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.06em;
  margin-top: 8px;
  color: var(--ok);
}
.stat-card .delta.flat { color: var(--ink-4); }
.stat-card .delta.bad  { color: var(--bad); }

/* ─── WORKOUT TAB ─── */
.view-switch {
  display: flex;
  gap: 4px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
}
.view-switch button {
  flex: 1;
  background: none;
  border: none;
  padding: 9px 14px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-radius: 999px;
}
.view-switch button.on {
  background: var(--ink);
  color: var(--bg);
}

/* Day plan cards */
.day-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
}
.day-card.power { border-left: 3px solid var(--accent-power); }
.day-card.hyper { border-left: 3px solid var(--accent-hyper); }
.day-card-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.day-card-head-l { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day-card-name {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.day-card-start {
  background: var(--ink);
  color: var(--bg);
  border: none;
  padding: 9px 16px;
  border-radius: 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  white-space: nowrap;
}
.day-card.power .day-card-start { background: var(--accent-power); color: var(--accent-ink); }
.day-card.hyper .day-card-start { background: var(--accent-hyper); color: var(--bg); }
.day-card-ex-list { padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 4px; }
.day-ex-row {
  display: flex; justify-content: space-between;
  gap: 10px;
  padding: 5px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.day-ex-row:last-child { border-bottom: none; }
.day-ex-row .ex-left { color: var(--ink-2); min-width: 0; }
.day-ex-row .ex-right {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.day-ex-row .bar-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--accent);
  margin-left: 6px;
  letter-spacing: 0.12em;
  font-weight: 700;
}
.day-card-desc {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.03em;
  line-height: 1.5;
  margin-top: 3px;
}
.day-ex-divider {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-4);
  padding: 10px 0 4px;
  border-top: 1px dashed var(--line-2);
  margin-top: 6px;
}
.day-ex-row.optional .ex-left,
.day-ex-row.optional .ex-right { color: var(--ink-4); }

/* ── Full-body day type ── */
.pill.fullbody { background: color-mix(in oklab, var(--accent-full) 14%, transparent); color: var(--accent-full); }
.eyebrow-fullbody { color: var(--accent-full); }
.eyebrow-fullbody::before {
  content: "";
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
  background: var(--accent-full);
}
.day-card.fullbody { border-left: 3px solid var(--accent-full); }
.day-card.fullbody .day-card-start { background: var(--accent-full); color: var(--accent-ink); }
.hist-card.fullbody { border-left: 3px solid var(--accent-full); }
.week-cell.fullbody .wc-mark {
  background: color-mix(in oklab, var(--accent-full) 14%, transparent);
  border-color: color-mix(in oklab, var(--accent-full) 38%, transparent);
  color: var(--accent-full);
}
.week-cell.fullbody .wc-tag { color: var(--accent-full); }
.week-cell.next .wc-mark {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.week-cell.next .wc-tag { color: var(--accent); font-weight: 800; }

/* ── Consistency card ──
   Replaces the old "N/4 sessions this week" quota readout. */
.streak-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 4px 0 2px;
}
.streak-big { display: flex; flex-direction: column; line-height: 1; }
.streak-big .sb-n {
  font-family: var(--font-mono);
  font-size: 30px;
  font-weight: 800;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.streak-big .sb-l {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-top: 5px;
}
.streak-weeks {
  display: flex;
  gap: 5px;
  flex: 1;
  align-items: center;
  justify-content: flex-end;
}
.sw-dot {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 1px solid var(--line-2);
  background: var(--card-2, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.sw-dot.on {
  background: color-mix(in oklab, var(--ok) 22%, transparent);
  border-color: color-mix(in oklab, var(--ok) 55%, transparent);
}
.sw-dot .sw-n {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--ok);
}
.streak-note {
  font-size: 12px;
  color: var(--ink-3);
  line-height: 1.55;
  padding-top: 10px;
  margin-top: 8px;
  border-top: 1px solid var(--line);
}

/* ── Intensity phase gate ── */
.phase-gate {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--line);
}
.pg-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 7px; }
.pg-tag {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 800; letter-spacing: 0.16em;
  color: var(--accent);
}
.pg-tag.locked { color: var(--ink-4); }
.pg-sub {
  font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-4);
}
.pg-track { display: flex; gap: 5px; margin-bottom: 8px; }
.pg-track i {
  flex: 1; height: 4px; border-radius: 2px;
  background: var(--line-2);
}
.pg-track i.on { background: var(--ok); }
.pg-body { font-size: 12px; color: var(--ink-3); line-height: 1.6; }
.phase-gate.on .pg-body { color: var(--ink-2); }

/* ── Effort target chip ── */
.effort-chip {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  padding: 9px 12px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 1px solid var(--line-2);
  background: transparent;
}
.effort-chip.hold-back { border-color: color-mix(in oklab, var(--info, var(--accent-full)) 40%, var(--line-2)); }
.effort-chip.to-failure { border-color: color-mix(in oklab, var(--bad) 38%, var(--line-2)); }
.ec-mark { font-size: 12px; line-height: 1; }
.effort-chip.hold-back .ec-mark { color: var(--accent-full); }
.effort-chip.to-failure .ec-mark { color: var(--bad); }
.ec-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
}
.effort-chip.hold-back .ec-label { color: var(--accent-full); }
.effort-chip.to-failure .ec-label { color: var(--bad); }
.ec-detail { font-size: 11px; color: var(--ink-4); }
.rpe-over {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  line-height: 1.55;
  color: var(--accent-hold);
}

/* ── Technique cue (AMRAP / myo-reps) ── */
.finisher-note {
  border: 1px solid color-mix(in oklab, var(--accent) 45%, var(--line-2));
  background: color-mix(in oklab, var(--accent) 9%, transparent);
  border-radius: 12px;
  padding: 11px 13px;
  margin-bottom: 10px;
}
.fn-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 6px; }
.fn-tag {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
  color: var(--accent);
}
.fn-set {
  font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-4);
}
.fn-cue { font-size: 12px; color: var(--ink-2); line-height: 1.6; }

/* ── Body-trend alarm ── */
.trend-alarm {
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 12px;
  border: 1px solid var(--line-2);
  background: var(--card);
}
.trend-alarm.bad {
  border-color: color-mix(in oklab, var(--bad) 50%, var(--line-2));
  background: color-mix(in oklab, var(--bad) 9%, var(--card));
}
.trend-alarm.warn {
  border-color: color-mix(in oklab, var(--accent-hold) 50%, var(--line-2));
  background: color-mix(in oklab, var(--accent-hold) 8%, var(--card));
}
.trend-alarm.measure {
  border-color: color-mix(in oklab, var(--accent-full) 42%, var(--line-2));
  background: color-mix(in oklab, var(--accent-full) 7%, var(--card));
}
.ta-head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.ta-mark {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
  line-height: 1;
}
.trend-alarm.bad .ta-mark { color: var(--bad); }
.trend-alarm.warn .ta-mark { color: var(--accent-hold); }
.trend-alarm.measure .ta-mark { color: var(--accent-full); }
.ta-title { font-size: 14px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }
.ta-body { font-size: 12px; color: var(--ink-3); line-height: 1.6; }
.ta-nums {
  display: flex; gap: 14px; flex-wrap: wrap;
  margin-top: 10px; padding-top: 9px;
  border-top: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-4);
}
.ta-nums b { color: var(--ink-2); font-size: 12px; margin-left: 4px; }
.ta-btn {
  margin-top: 11px;
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid color-mix(in oklab, var(--accent-full) 50%, var(--line-2));
  background: transparent;
  color: var(--accent-full);
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
}

/* ── Rolling 7-day average ── */
.roll-card, .quick-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.roll-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
.roll-big { display: flex; flex-direction: column; line-height: 1; }
.roll-big .rb-n {
  font-family: var(--font-mono); font-size: 30px; font-weight: 800;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.roll-big.under .rb-n { color: var(--bad); }
.roll-big.floor .rb-n { color: var(--accent-hold); }
.roll-big.target .rb-n { color: var(--ok); }
.roll-big .rb-u {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-4); margin-top: 6px;
}
.roll-marks { display: flex; flex-direction: column; gap: 3px; text-align: right; }
.rm { display: flex; gap: 8px; justify-content: flex-end; align-items: baseline; }
.rm-k {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-4);
}
.rm-v { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rm-v em { font-style: normal; color: var(--ink-4); font-size: 10px; }
.roll-track {
  position: relative;
  height: 5px;
  border-radius: 3px;
  background: var(--line);
  margin: 12px 0 9px;
  overflow: hidden;
}
.roll-track .fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--ink-3); border-radius: 3px; }
.roll-track .floor-mark { position: absolute; top: -2px; width: 2px; height: 9px; background: var(--accent-hold); z-index: 2; }
.roll-note { font-size: 12px; line-height: 1.55; color: var(--ink-3); }
.roll-note.under { color: var(--bad); }
.roll-note.floor { color: var(--accent-hold); }
.roll-note.target { color: var(--ok); }

/* ── Quick add ── */
.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.quick-btn {
  display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--line-2);
  background: transparent;
  color: var(--ink-2);
  text-align: left;
}
.quick-btn:active { transform: scale(0.97); border-color: var(--accent); }
.qb-name { font-size: 12px; font-weight: 700; }
.qb-nums { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.qb-nums em { font-style: normal; font-size: 8px; margin-left: 1px; letter-spacing: 0.06em; }

/* ── One-time data-repair notice ── */
.mig-card { border-color: color-mix(in oklab, var(--accent-full) 40%, var(--line)); }
.mig-body { font-size: 12px; color: var(--ink-3); line-height: 1.6; }
.mig-body ul { margin: 8px 0 0; padding-left: 16px; display: flex; flex-direction: column; gap: 6px; }
.mig-body li { line-height: 1.55; }
.mig-body b { color: var(--ink-2); font-family: var(--font-mono); }
.mig-body i { font-family: var(--font-mono); font-style: normal; color: var(--ink-4); }

/* ── Program switcher ── */
.prog-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 4px;
}
.prog-switch button {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  padding: 11px 12px;
  border-radius: 11px;
  border: 1px solid var(--line-2);
  background: var(--card);
  color: var(--ink-3);
}
.prog-switch button.on {
  border-color: var(--accent);
  background: color-mix(in oklab, var(--accent) 10%, var(--card));
  color: var(--ink);
}
.prog-switch .ps-name { font-size: 13px; font-weight: 700; }
.prog-switch .ps-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.04em;
  color: var(--ink-4);
  line-height: 1.45;
}

/* ── Warm-up ramp ── */
.warmup {
  border: 1px dashed var(--line-2);
  border-radius: 12px;
  padding: 11px 13px 9px;
  margin-bottom: 12px;
  background: color-mix(in oklab, var(--accent-hold) 5%, transparent);
}
.warmup-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.warmup-head .wu-k {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent-hold);
  font-weight: 700;
}
.warmup-head .wu-skip {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--ink-4);
  background: none;
  border: none;
  padding: 2px 0;
}
.warmup-rows { display: flex; flex-direction: column; gap: 2px; }
.wu-row {
  display: grid;
  grid-template-columns: 42px 1fr auto;
  align-items: baseline;
  gap: 10px;
  padding: 4px 0;
  border-bottom: 1px solid var(--line);
}
.wu-row:last-child { border-bottom: none; }
.wu-row .wu-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.wu-row .wu-w {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.wu-row .wu-w em { font-style: normal; font-size: 9px; color: var(--ink-4); margin-left: 2px; }
.wu-row .wu-r {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.wu-row.target .wu-tag { color: var(--accent); }
.wu-row.target .wu-w { color: var(--ink); font-size: 16px; }

/* ── Minimum session ──
   Deliberately NOT green and deliberately not styled like a primary action.
   Green reads as "save / go" and this ends the session; the first version was
   green and cost a real workout. Neutral until armed, then explicitly a warning. */
.finish-btn.min-session {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 8px;
  padding: 13px 18px;
  text-transform: none;
  letter-spacing: 0;
  border: 1px solid var(--line-2);
  background: transparent;
  color: var(--ink-3);
}
.finish-btn.min-session .ms-main {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.finish-btn.min-session .ms-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.03em;
  color: var(--ink-4);
  text-transform: none;
}
.min-confirm {
  margin-top: 8px;
  padding: 13px 15px;
  border-radius: 14px;
  border: 1px solid color-mix(in oklab, var(--accent-hold) 55%, var(--line-2));
  background: color-mix(in oklab, var(--accent-hold) 9%, var(--card));
}
.mc-warn {
  font-size: 12px;
  line-height: 1.6;
  color: var(--ink-2);
  margin-bottom: 11px;
}
.mc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mc-actions button {
  padding: 12px;
  border-radius: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mc-cancel {
  border: 1px solid var(--line-2);
  background: transparent;
  color: var(--ink-2);
}
.mc-confirm {
  border: 1px solid color-mix(in oklab, var(--bad) 55%, var(--line-2));
  background: color-mix(in oklab, var(--bad) 14%, transparent);
  color: var(--bad);
}

/* Session history rows */
.hist-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px 16px;
}
.hist-card.power { border-left: 3px solid var(--accent-power); }
.hist-card.hyper { border-left: 3px solid var(--accent-hyper); }
.hist-card-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.hist-card-day {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.hist-card-date {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.hist-ex { font-size: 11px; color: var(--ink-3); margin-bottom: 3px; line-height: 1.4; }
.hist-ex .name { color: var(--ink-2); font-weight: 600; }
.hist-ex .sets {
  font-family: var(--font-mono);
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}
.del-btn {
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  padding: 5px 10px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  font-size: 11px;
}
.del-confirm { display: flex; gap: 6px; }
.del-confirm button {
  padding: 5px 10px;
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid var(--line-2);
  background: transparent;
  color: var(--ink-3);
}
.del-confirm button.danger { background: var(--bad); border-color: var(--bad); color: var(--ink); }

/* Date nav — Diet tab, for editing past days */
.date-nav {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  gap: 8px;
  align-items: center;
  padding: 10px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
}
.date-nav-arrow {
  background: transparent;
  border: 1px solid var(--line-2);
  color: var(--ink-2);
  width: 32px; height: 32px;
  border-radius: 50%;
  font-size: 14px;
  font-weight: 700;
}
.date-nav-arrow:disabled {
  opacity: 0.35;
  cursor: default;
}
.date-nav-label {
  text-align: center;
  min-width: 0;
}
.date-nav-label .dn-day {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.date-nav-label .dn-sub {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--ink-3);
  text-transform: uppercase;
  margin-top: 2px;
  font-weight: 600;
}
.date-nav-today {
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  padding: 6px 12px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

/* ─── DIET TAB ─── */

/* Targets card — kcal + prot bars */
.targets-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
}
.targets-head {
  display: flex; justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.targets-phase {
  display: flex; flex-direction: column; gap: 4px;
}
.targets-phase .tk {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.targets-phase .tv {
  font-size: 15px; font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.targets-phase .tv .ph {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-right: 8px;
}
.targets-phase.cut .tv .ph { color: var(--info); }

.bar-row { margin-top: 14px; }
.bar-row + .bar-row { margin-top: 16px; }
.bar-row-head {
  display: flex; justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.bar-row-k { font-size: 13px; color: var(--ink-2); }
.bar-row-v {
  font-family: var(--font);
  font-size: 15px; font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.bar-row-v.ok { color: var(--ok); }
.bar-row-v.warn { color: var(--warn); }
.bar-row-v.bad { color: var(--bad); }
.bar-row-v .tot {
  color: var(--ink-4);
  font-weight: 500;
  font-size: 11px;
  margin-left: 4px;
}
.bar-fat {
  height: 8px;
  background: var(--card-2);
  border-radius: 4px;
  overflow: hidden;
}
.bar-fat > i {
  display: block; height: 100%;
  border-radius: 4px;
  background: var(--accent);
  transition: width 0.4s ease;
}
.bar-fat > i.ok { background: var(--ok); }
.bar-fat > i.warn { background: var(--warn); }
.bar-fat > i.bad { background: var(--bad); }
.bar-note {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  margin-top: 4px;
}
.bar-note.warn { color: var(--warn); }

/* Meal list rows */
.meal-row {
  display: flex; justify-content: space-between;
  align-items: center;
  padding: 11px 0;
  border-top: 1px solid var(--line);
  gap: 10px;
}
.meal-row:first-child { border-top: none; }
.meal-row-l { flex: 1; min-width: 0; }
.meal-row-name { font-size: 13px; font-weight: 700; color: var(--ink); }
.meal-row-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}
.meal-x {
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  padding: 6px 10px;
  color: var(--ink-3);
  font-size: 14px;
  line-height: 1;
}

/* Quick-add chips */
.qa-head {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-3);
  font-weight: 700;
  text-transform: uppercase;
  margin: 14px 0 8px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.qa-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.qa-chip {
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  padding: 6px 12px;
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 600;
}
.qa-chip.dashed { border-style: dashed; color: var(--ink-3); }
.qa-chip.fav {
  border-color: color-mix(in oklab, var(--accent-gold) 50%, var(--line-2));
  background: color-mix(in oklab, var(--accent-gold) 8%, var(--card-2));
}

/* Extras form */
.extras-form {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr auto;
  gap: 8px;
  align-items: end;
  margin-top: 10px;
}
.extras-form label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  margin-bottom: 4px;
  text-transform: uppercase;
}
.extras-form input {
  width: 100%;
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  padding: 9px;
  color: var(--ink);
  font-size: 13px;
}
.extras-form input.num { text-align: center; font-variant-numeric: tabular-nums; }
.extras-form button.add {
  background: var(--accent);
  border: none;
  color: var(--accent-ink);
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 15px;
}

/* 7-day grid (diet) */
.d7-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.d7-cell {
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 2px;
  text-align: center;
}
.d7-cell.ok   { background: color-mix(in oklab, var(--ok) 12%, var(--card-2)); border-color: color-mix(in oklab, var(--ok) 28%, transparent); }
.d7-cell.half { background: color-mix(in oklab, var(--warn) 12%, var(--card-2)); border-color: color-mix(in oklab, var(--warn) 28%, transparent); }
.d7-cell.bad  { background: color-mix(in oklab, var(--bad) 12%, var(--card-2)); border-color: color-mix(in oklab, var(--bad) 28%, transparent); }
.d7-cell.today { box-shadow: inset 0 0 0 1px var(--accent); }
.d7-cell .dow {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ink-4);
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}
.d7-cell .dot {
  width: 8px; height: 8px; border-radius: 50%;
  margin: 0 auto 3px;
}
.d7-cell.ok .dot   { background: var(--ok); }
.d7-cell.half .dot { background: var(--warn); }
.d7-cell.bad .dot  { background: var(--bad); }
.d7-cell.empty .dot { background: var(--ink-4); }
.d7-cell .d7-v {
  font-family: var(--font-mono);
  font-size: 9px;
  font-variant-numeric: tabular-nums;
  color: var(--ink-3);
  font-weight: 600;
}
.d7-cell.ok .d7-v   { color: var(--ok); }
.d7-cell.half .d7-v { color: var(--warn); }
.d7-cell.bad .d7-v  { color: var(--bad); }
.d7-legend {
  display: flex; gap: 14px;
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--ink-4);
}
.d7-legend .sw {
  display: inline-block;
  width: 7px; height: 7px; border-radius: 50%;
  margin-right: 5px;
  vertical-align: middle;
}
.d7-legend .sw.ok { background: var(--ok); }
.d7-legend .sw.half { background: var(--warn); }
.d7-legend .sw.bad { background: var(--bad); }

/* 14-day summary */
.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.summary-cell { text-align: center; }
.summary-cell .sk {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ink-4);
  letter-spacing: 0.14em;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.summary-cell .sv {
  font-size: 22px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.summary-cell .sv.ok { color: var(--ok); }
.summary-cell .sv.warn { color: var(--warn); }
.summary-cell .sv.bad { color: var(--bad); }
.summary-cell .sv.info { color: var(--info); }

.insight-box {
  padding: 11px 14px;
  border-radius: 10px;
  border-left: 3px solid var(--warn);
  background: color-mix(in oklab, var(--warn) 10%, var(--card-2));
  font-size: 12px;
  color: var(--warn);
  line-height: 1.5;
}
.insight-box.ok {
  border-left-color: var(--ok);
  background: color-mix(in oklab, var(--ok) 10%, var(--card-2));
  color: var(--ok);
}

/* Meal library */
.meal-cat {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--accent);
  font-weight: 700;
  text-transform: uppercase;
  margin: 4px 0 10px;
}
.meal-lib-item {
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 8px;
}
.meal-lib-top {
  display: flex; justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 6px;
}
.meal-lib-name { font-size: 13px; font-weight: 800; color: var(--ink); margin-bottom: 3px; letter-spacing: -0.01em; }
.meal-lib-desc { font-size: 11px; color: var(--ink-3); line-height: 1.5; }
.meal-lib-tip {
  font-size: 11px;
  color: var(--ink-4);
  margin-top: 4px;
  font-style: italic;
  line-height: 1.5;
}
.meal-lib-add {
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  padding: 7px 12px;
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: nowrap;
}
.meal-lib-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}
.meal-lib-mini-row {
  display: flex;
  gap: 6px;
}
.meal-lib-mini {
  background: transparent;
  border: 1px solid var(--line-2);
  color: var(--ink-3);
  border-radius: 8px;
  padding: 5px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1;
  min-width: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  -webkit-appearance: none;
  appearance: none;
}
.meal-lib-mini.star.on {
  color: var(--accent-gold);
  border-color: color-mix(in oklab, var(--accent-gold) 50%, var(--line-2));
  background: color-mix(in oklab, var(--accent-gold) 10%, transparent);
}
.meal-lib-mini:active { transform: scale(0.95); }
.meal-lib-item.fav {
  border-left: 3px solid var(--accent-gold);
  padding-left: 12px;
}
.meal-lib-meta {
  display: flex; gap: 12px;
  margin-top: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}
.meal-lib-meta .k { color: var(--accent); }
.meal-lib-meta .p { color: var(--info); }
.meal-lib-meta .tag { color: var(--ink-4); font-weight: 500; }

.add-meal-open {
  width: 100%;
  background: none;
  border: 1px dashed var(--line-2);
  border-radius: 10px;
  padding: 12px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 700;
}
.add-meal-form {
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
}
.add-meal-form label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  margin-bottom: 4px;
  display: block;
  text-transform: uppercase;
}
.add-meal-form input,
.add-meal-form select {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 8px;
